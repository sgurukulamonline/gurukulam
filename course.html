<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Details – Sanathana Gurukulam</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7E8C8;--sand:#E8C98F;--maroon:#7A2E16;--brown:#4A1F0E;--gold:#D99A27;
  --card:#FFF8EA;--muted:#7d5a45;--line:rgba(122,46,22,.15);--shadow:0 6px 18px rgba(74,31,14,.12);
}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{
  font-family:'Poppins',sans-serif;color:var(--brown);
  background:radial-gradient(circle at 20% 0,#fff6e0,var(--cream) 60%);min-height:100vh;
}
h1,h2,h3{font-family:'Cormorant Garamond',serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.btn{
  background:var(--maroon);color:var(--cream);padding:10px 20px;border-radius:12px;
  font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:all .2s;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.gold{background:var(--gold);color:var(--brown)}
.btn.ghost{background:none;border:1.5px solid var(--maroon);color:var(--maroon)}
.btn.sm{padding:6px 14px;font-size:.82rem}

.top{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 22px;background:var(--brown);color:var(--cream);
}
.top b{font-family:'Cormorant Garamond';font-size:1.5rem}
.top b a{color:inherit}
.top span{display:flex;gap:14px;align-items:center;font-size:.88rem}
.top a:hover{color:var(--gold)}

.wrap{max-width:1100px;margin:0 auto;padding:26px 18px 60px}

.hero2{
  display:grid;gap:24px;grid-template-columns:1fr;margin-bottom:26px;
  background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--shadow);border:1px solid var(--line);
}
@media(min-width:800px){.hero2{grid-template-columns:340px 1fr}}
.hero2 .pic-box{
  width:100%;height:220px;border-radius:16px;overflow:hidden;background:#f3e3c6;display:grid;place-items:center;
}
.hero2 img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.hero2 h1{font-size:2.5rem;color:var(--maroon);line-height:1.15}

.bar{height:10px;background:#efe0bd;border-radius:8px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e6a935,var(--gold));border-radius:8px;transition:width .3s}

.panel{background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--shadow);margin-bottom:24px;border:1px solid var(--line)}
.panel h2{font-size:1.7rem;color:var(--maroon);margin-bottom:14px}

.lesson{
  display:flex;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);
  cursor:pointer;border-radius:10px;transition:background .2s;
}
.lesson:hover{background:rgba(232,201,143,.2)}
.lesson:last-child{border-bottom:0}
.lesson input{width:22px;height:22px;accent-color:var(--maroon);cursor:pointer}
.lesson.completed{color:var(--muted);text-decoration:line-through}

.video{aspect-ratio:16/9;width:100%;border:0;border-radius:16px;margin-bottom:24px;box-shadow:var(--shadow)}
.tag{padding:3px 10px;border-radius:6px;font-size:.72rem;font-weight:600;background:#f1b36a;color:var(--brown)}
.muted{color:var(--muted);font-size:.85rem}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--brown);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0}
.bottom a{flex:1;text-align:center;color:#d9b88f;font-size:.66rem;padding:4px 0}
.bottom a span{display:block;font-size:1.3rem}
.bottom a.on{color:var(--gold);font-weight:600}
@media(min-width:900px){.bottom{max-width:720px;margin:0 auto 12px;border-radius:22px}}
</style>
</head>
<body>

<div class="top">
  <b><a href="index.html">Sanathana Gurukulam</a></b>
  <span>
    <a href="index.html">Home</a>
    <a href="courses.html">Courses</a>
    <a href="live.html">Live</a>
    <a href="community.html">Community</a>
    <a href="more.html">Explore</a>
  </span>
</div>

<div class="wrap">
  <div style="margin-bottom:14px"><a href="courses.html" style="font-size:.9rem;color:var(--muted);font-weight:500">← Back to All Courses</a></div>
  <div id="box"><p class="muted" style="text-align:center;padding:40px">Loading course details…</p></div>
</div>

<script type="module">
import { auth, db, onAuthStateChanged, ref, get, set, update, remove, esc, ytEmbed, DEFAULT_COURSES } from "./firebase-init.js";

const box = document.getElementById("box");
const id = new URLSearchParams(location.search).get("id");
let user, course, enr;
const path = () => `enrollments/${user.uid}/${id}`;

onAuthStateChanged(auth, async u => {
  user = u;
  await load();
});

const getCourseIcon = id => {
  if (id.includes("gita")) return "📖";
  if (id.includes("sanskrit")) return "🪷";
  if (id.includes("history")) return "📜";
  if (id.includes("ramayan")) return "🏹";
  if (id.includes("yoga")) return "🧘";
  if (id.includes("vishnu")) return "🪔";
  if (id.includes("veda")) return "🕉️";
  if (id.includes("temple")) return "🛕";
  return "🕉️";
};

async function load() {
  if (!id) {
    box.innerHTML = `<div style="text-align:center;padding:40px">
      <h2>Course Not Found</h2>
      <p class="muted" style="margin:10px 0 20px">No course ID specified.</p>
      <a class="btn" href="courses.html">Browse All Courses</a>
    </div>`;
    return;
  }

  const snap = await get(ref(db, "courses/" + id));
  course = snap.val() || DEFAULT_COURSES.find(x => x.id === id);

  if (!course) {
    box.innerHTML = `<div style="text-align:center;padding:40px">
      <h2>Course Not Found</h2>
      <p class="muted" style="margin:10px 0 20px">The course you are looking for does not exist.</p>
      <a class="btn" href="courses.html">Browse All Courses</a>
    </div>`;
    return;
  }

  enr = user ? (await get(ref(db, path()))).val() : null;
  render();
}

function render() {
  const n = course.lessons || 10;
  const done = enr?.done || {};
  const completedCount = Object.keys(done).length;
  const pr = enr ? Math.min(100, Math.round(completedCount / n * 100)) : 0;
  const embed = ytEmbed(course.videoUrl);

  const loginRedirect = "login.html?redirect=" + encodeURIComponent("course.html?id=" + id);
  const act = !user 
    ? `<a class="btn gold" href="${loginRedirect}">Sign in to Enroll</a>`
    : !enr 
    ? `<button class="btn gold" id="enroll">Enroll in Course</button>`
    : `
      <div class="bar"><i style="width:${pr}%"></i></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px">
        <span class="muted">${pr}% complete (${completedCount}/${n} lessons)</span>
        ${pr >= 100 ? '<a class="btn sm gold" href="certificate.html?id=' + encodeURIComponent(id) + '">🏅 View Certificate</a>' : ''}
      </div>
    `;

  let lessonsHtml = "";
  for (let i = 1; i <= n; i++) {
    const isChecked = Boolean(done["L" + i]);
    lessonsHtml += `
      <label class="lesson ${isChecked ? 'completed' : ''}">
        ${enr ? `<input type="checkbox" data-l="${i}" ${isChecked ? "checked" : ""}>` : `<span style="font-size:1.2rem">🔒</span>`}
        <div>
          <b>Lesson ${i}: ${getLessonTitle(course.id, i)}</b>
          <div class="muted">Audio lecture, guided reading & shloka study</div>
        </div>
      </label>
    `;
  }

  box.innerHTML = `
    <div class="hero2">
      <div class="pic-box">
        ${course.imageUrl ? `<img src="${esc(course.imageUrl)}" alt="${esc(course.title)}" onerror="this.onerror=null;this.parentElement.innerHTML='<span style=\\'font-size:4rem\\'>${getCourseIcon(course.id)}</span>'">` : `<span style="font-size:4rem">${getCourseIcon(course.id)}</span>`}
      </div>
      <div>
        <div style="margin-bottom:8px">
          <span class="tag">${course.type === "free" ? "Free" : "Paid"}</span>
          <span class="muted" style="margin-left:8px">${n} lessons</span>
        </div>
        <h1>${esc(course.title)}</h1>
        <p class="muted" style="margin:10px 0 18px;font-size:.95rem">${esc(course.desc || "")}</p>
        <div>${act}</div>
      </div>
    </div>

    ${embed ? `<iframe class="video" src="${embed}" title="Course intro video" allowfullscreen></iframe>` : ""}

    <div class="panel">
      <h2>Course Modules & Lessons</h2>
      ${lessonsHtml}
      ${enr ? '' : '<p class="muted" style="margin-top:16px">Enroll now to track your daily progress and unlock lesson checkboxes.</p>'}
    </div>
  `;
}

function getLessonTitle(courseId, num) {
  const titles = {
    "bhagavad-gita": ["Arjuna Vishada Yoga", "Sankhya Yoga & Immortality", "Karma Yoga & Selfless Action", "Jnana Karma Sannyasa Yoga", "Karma Sannyasa Yoga", "Dhyana Yoga & Meditation", "Jnana Vijnana Yoga", "Akshara Brahma Yoga", "Raja Vidya Raja Guhya", "Vibhuti Yoga", "Vishwaroopa Darshana", "Bhakti Yoga & Beyond"],
    "sanskrit-basics": ["Varnamala (Vowels & Consonants)", "Pronunciation & Sthana", "Basic Nouns & Pronouns", "Simple Verbs in Present Tense", "Sandhi Foundations", "Shloka Chanting Metres", "Everyday Gurukulam Conversation", "Subhashitas Recitation"]
  };
  const list = titles[courseId];
  return (list && list[num - 1]) || `Module ${num} - Core Concept & Practice`;
}

box.addEventListener("click", async e => {
  if (e.target.id !== "enroll") return;
  e.target.disabled = true;
  e.target.textContent = "Enrolling...";
  await set(ref(db, path()), { progress: 0, enrolledAt: Date.now(), done: {} });
  await load();
});

box.addEventListener("change", async e => {
  const i = e.target.dataset.l;
  if (!i) return;
  const r = ref(db, `${path()}/done/L${i}`);
  if (e.target.checked) await set(r, true);
  else await remove(r);

  enr = (await get(ref(db, path()))).val() || {};
  const total = course.lessons || 10;
  const count = Object.keys(enr.done || {}).length;
  const pr = Math.min(100, Math.round(count / total * 100));

  await update(ref(db, path()), {
    progress: pr,
    ...(pr >= 100 && !enr.completedAt ? { completedAt: Date.now() } : {})
  });
  await load();
});
</script>
<nav class="bottom" aria-label="App">
  <a href="index.html"><span>🏠</span>Home</a>
  <a class="on" href="courses.html"><span>📖</span>Courses</a>
  <a href="live.html"><span>🎥</span>Live</a>
  <a href="community.html"><span>👥</span>Community</a>
  <a href="more.html"><span>🛕</span>Explore</a>
</nav>
</body>
</html>
