<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Details – Sanathana Gurukulam</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7E8C8;--sand:#E8C98F;--maroon:#7A2E16;--brown:#4A1F0E;--gold:#D99A27;
  --card:#FFF8EA;--muted:#7d5a45;--line:rgba(122,46,22,.15);--shadow:0 6px 18px rgba(74,31,14,.12);
}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{
  font-family:'Poppins',sans-serif;color:var(--brown);
  background:radial-gradient(circle at 20% 0,#fff6e0,var(--cream) 60%);min-height:100vh;
}
h1,h2,h3{font-family:'Cormorant Garamond',serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.btn{
  background:var(--maroon);color:var(--cream);padding:10px 20px;border-radius:12px;
  font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:all .2s;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.gold{background:var(--gold);color:var(--brown)}
.btn.ghost{background:none;border:1.5px solid var(--maroon);color:var(--maroon)}
.btn.sm{padding:6px 14px;font-size:.82rem}

.top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px 18px;background:var(--brown);color:var(--cream);
}
.top b{font-family:'Cormorant Garamond';font-size:1.45rem;white-space:nowrap}
.top b a{color:inherit}
.top span{display:flex;gap:12px;align-items:center;font-size:.85rem}
.top a:hover{color:var(--gold)}
@media(max-width:768px){
  .top span a{display:none}
}

.wrap{max-width:1100px;margin:0 auto;padding:18px 16px calc(85px + env(safe-area-inset-bottom,0px))}

.hero2{
  display:grid;gap:20px;grid-template-columns:1fr;margin-bottom:22px;
  background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line);
}
@media(min-width:800px){.hero2{grid-template-columns:320px 1fr;padding:24px}}
.hero2 .pic-box{
  width:100%;height:200px;border-radius:14px;overflow:hidden;background:#f3e3c6;display:grid;place-items:center;
}
@media(max-width:600px){.hero2 .pic-box{height:160px}}
.hero2 img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.hero2 h1{font-size:clamp(1.6rem, 5.5vw, 2.4rem);color:var(--maroon);line-height:1.2;margin:4px 0 8px}

.bar{height:10px;background:#efe0bd;border-radius:8px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e6a935,var(--gold));border-radius:8px;transition:width .3s}

.panel{background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px;border:1px solid var(--line)}
@media(max-width:600px){.panel{padding:16px;border-radius:14px}}
.panel h2{font-size:1.7rem;color:var(--maroon);margin-bottom:12px}

.course-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 20px;
  margin-top: 10px;
}
@media(min-width: 960px) {
  .course-layout {
    grid-template-columns: 1fr 370px;
    align-items: start;
    gap: 24px;
  }
  .sidebar-sticky {
    position: sticky;
    top: 20px;
  }
}

.lesson-card-item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: #fff;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all .2s;
  word-break: break-word;
}
@media(max-width:480px){.lesson-card-item{padding:10px 12px;gap:10px}}
.lesson-card-item:hover {
  background: rgba(232,201,143,.25);
  border-color: var(--gold);
}
.lesson-card-item.active {
  background: #fdf5e2;
  border: 2px solid var(--gold);
  box-shadow: 0 4px 14px rgba(217,154,39,.22);
}
.lesson-card-item.completed {
  opacity: .88;
}
.lesson-card-item.completed .lesson-title-text {
  text-decoration: line-through;
  color: var(--muted);
}
.lesson-num-badge {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--sand);
  color: var(--brown);
  display: grid;
  place-items: center;
  font-size: .8rem;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 2px;
}
.lesson-card-item.active .lesson-num-badge {
  background: var(--maroon);
  color: var(--cream);
}
.lesson-card-item.completed .lesson-num-badge {
  background: #dcfce7;
  color: #166534;
}
.lesson-cb {
  width: 20px;
  height: 20px;
  accent-color: var(--maroon);
  cursor: pointer;
  margin-top: 5px;
  flex-shrink: 0;
}

/* Responsive Native Video Player with YouTube controls */
.yt-player-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #0d0603;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
  margin-bottom: 20px;
  border: 1px solid rgba(217,154,39,.3);
}
.yt-player-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

/* Responsive Lesson Navigation Bar */
.lesson-nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 14px 18px;
  background: var(--card);
  border-radius: 16px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
}
@media(max-width: 600px) {
  .lesson-nav-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 12px;
  }
  .lesson-nav-bar #btnPrevLesson {
    grid-column: 1;
    width: 100%;
    padding: 10px 8px;
    font-size: .8rem;
  }
  .lesson-nav-bar #btnNextLesson {
    grid-column: 2;
    width: 100%;
    padding: 10px 8px;
    font-size: .8rem;
  }
  .lesson-nav-bar .lesson-nav-center {
    grid-column: 1 / -1;
    width: 100%;
  }
  .lesson-nav-bar .lesson-nav-center button {
    width: 100%;
    padding: 11px 12px;
    font-size: .88rem;
  }
}

/* Sections Styling */
.section-block {
  margin-bottom: 28px;
}
.section-title {
  font-size: 1.45rem;
  color: var(--maroon);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.photo-card {
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
}
.photo-card img {
  width: 100%;
  max-height: 480px;
  object-fit: contain;
  background: #fbf5e8;
  display: block;
}
.photo-caption {
  padding: 14px 18px;
  font-size: .92rem;
  color: var(--brown);
  border-top: 1px solid var(--line);
  background: #fffdf9;
}
.matter-card {
  background: var(--card);
  border-radius: 18px;
  padding: 22px 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  line-height: 1.7;
}
.matter-content {
  font-size: 1.02rem;
  color: #3b1709;
}

.tag{padding:3px 10px;border-radius:6px;font-size:.72rem;font-weight:600;background:#f1b36a;color:var(--brown)}
.muted{color:var(--muted);font-size:.85rem}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--brown);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0}
.bottom a{flex:1;text-align:center;color:#d9b88f;font-size:.66rem;padding:4px 0}
.bottom a span{display:block;font-size:1.3rem}
.bottom a.on{color:var(--gold);font-weight:600}
@media(min-width:900px){.bottom{max-width:720px;margin:0 auto 12px;border-radius:22px}}
</style>
</head>
<body>

<div class="top">
  <b><a href="index.html">Sanathana Gurukulam</a></b>
  <span>
    <a href="index.html">Home</a>
    <a href="courses.html">Courses</a>
    <a href="live.html">Live</a>
    <a href="community.html">Community</a>
    <a href="more.html">Explore</a>
  </span>
</div>

<div class="wrap">
  <div style="margin-bottom:14px"><a href="courses.html" style="font-size:.9rem;color:var(--muted);font-weight:500">← Back to All Courses</a></div>
  <div id="box"><p class="muted" style="text-align:center;padding:40px">Loading course details…</p></div>
</div>

<script type="module">
import { auth, db, onAuthStateChanged, ref, get, set, update, remove, esc, parseYouTube, parseVideoSource, DEFAULT_COURSES, getCourseLessonCount } from "./firebase-init.js";

const box = document.getElementById("box");
const id = new URLSearchParams(location.search).get("id");
let user, course, enr;
let activeLessonIdx = 0;
const path = () => `enrollments/${user.uid}/${id}`;

onAuthStateChanged(auth, async u => {
  user = u;
  await load();
});

const getCourseIcon = id => {
  const s = String(id || "").toLowerCase();
  if (s.includes("gita")) return "📖";
  if (s.includes("sanskrit")) return "🪷";
  if (s.includes("history")) return "📜";
  if (s.includes("ramayan")) return "🏹";
  if (s.includes("yoga")) return "🧘";
  if (s.includes("vishnu")) return "🪔";
  if (s.includes("veda")) return "🕉️";
  if (s.includes("temple")) return "🛕";
  return "🕉️";
};

function getLessonTitle(courseId, num) {
  const titles = {
    "bhagavad-gita": ["Arjuna Vishada Yoga", "Sankhya Yoga & Immortality", "Karma Yoga & Selfless Action", "Jnana Karma Sannyasa Yoga", "Karma Sannyasa Yoga", "Dhyana Yoga & Meditation", "Jnana Vijnana Yoga", "Akshara Brahma Yoga", "Raja Vidya Raja Guhya", "Vibhuti Yoga", "Vishwaroopa Darshana", "Bhakti Yoga & Beyond"],
    "sanskrit-basics": ["Varnamala (Vowels & Consonants)", "Pronunciation & Sthana", "Basic Nouns & Pronouns", "Simple Verbs in Present Tense", "Sandhi Foundations", "Shloka Chanting Metres", "Everyday Gurukulam Conversation", "Subhashitas Recitation"]
  };
  const list = titles[courseId];
  return (list && list[num - 1]) || `Module ${num} - Core Concept & Practice`;
}

function getCourseLessons(c) {
  if (!c) return [];
  if (Array.isArray(c.lessons) && c.lessons.length) {
    return c.lessons.map((les, idx) => ({
      id: les.id || ("les_" + (idx + 1)),
      title: les.title || `Lesson ${idx + 1}`,
      duration: les.duration || "15 mins",
      summary: les.summary || "",
      blocks: Array.isArray(les.blocks) ? les.blocks : []
    }));
  }

  // Fallback: migrate legacy flat sections into Lesson 1
  if (Array.isArray(c.sections) && c.sections.length) {
    return [{
      id: "les_1",
      title: "Lesson 1: " + (c.title || "Foundations & Lecture"),
      duration: "20 mins",
      summary: c.desc || "Complete sacred study material",
      blocks: c.sections
    }];
  }

  // Fallback: generate default lesson syllabus
  const n = typeof c.lessons === "number" ? c.lessons : (c.lessonCount || 8);
  const list = [];
  for (let i = 1; i <= n; i++) {
    const title = getLessonTitle(c.id, i);
    const blocks = [];
    if (i === 1 && c.videoUrl) {
      blocks.push({
        id: "blk_v1",
        type: "video",
        title: "Introductory Lecture",
        url: c.videoUrl
      });
    }
    if (i === 1 && c.desc) {
      blocks.push({
        id: "blk_m1",
        type: "matter",
        title: "Course Overview & Guidance",
        text: c.desc
      });
    }
    list.push({
      id: "les_" + i,
      title: `Lesson ${i}: ${title}`,
      duration: "15 mins",
      summary: "Audio lecture, guided contemplation & shloka study",
      blocks
    });
  }
  return list;
}

async function load() {
  if (!id) {
    box.innerHTML = `<div style="text-align:center;padding:40px">
      <h2>Course Not Found</h2>
      <p class="muted" style="margin:10px 0 20px">No course ID specified.</p>
      <a class="btn" href="courses.html">Browse All Courses</a>
    </div>`;
    return;
  }

  const snap = await get(ref(db, "courses/" + id));
  course = snap.val() || DEFAULT_COURSES.find(x => x.id === id);

  if (!course) {
    box.innerHTML = `<div style="text-align:center;padding:40px">
      <h2>Course Not Found</h2>
      <p class="muted" style="margin:10px 0 20px">The course you are looking for does not exist.</p>
      <a class="btn" href="courses.html">Browse All Courses</a>
    </div>`;
    return;
  }

  enr = user ? (await get(ref(db, path()))).val() : getGuestEnrollment(id);

  const lessons = getCourseLessons(course);
  if (enr && enr.done) {
    const firstUndone = lessons.findIndex((_, idx) => !enr.done["L" + (idx + 1)]);
    if (firstUndone !== -1) {
      activeLessonIdx = firstUndone;
    }
  }

  render();
}

function getGuestEnrollment(cid) {
  try {
    const raw = localStorage.getItem("sg_guest_enrollments");
    return raw ? (JSON.parse(raw)[cid] || null) : null;
  } catch(e) { return null; }
}

function saveGuestEnrollment(cid, data) {
  try {
    const raw = localStorage.getItem("sg_guest_enrollments");
    const all = raw ? (JSON.parse(raw) || {}) : {};
    all[cid] = data;
    localStorage.setItem("sg_guest_enrollments", JSON.stringify(all));
  } catch(e) {}
}

function render() {
  const lessons = getCourseLessons(course);
  const n = lessons.length;
  if (activeLessonIdx < 0 || activeLessonIdx >= n) activeLessonIdx = 0;
  const activeLesson = lessons[activeLessonIdx] || lessons[0] || { title: "Introduction", blocks: [] };

  const done = enr?.done || {};
  const completedCount = Object.keys(done).filter(k => done[k]).length;
  const pr = enr && n > 0 ? Math.min(100, Math.round(completedCount / n * 100)) : 0;

  const loginRedirect = "login.html?redirect=" + encodeURIComponent("course.html?id=" + id);
  const act = !enr
    ? `<button class="btn gold" id="enroll">Enroll &amp; Start Learning</button>`
    : `
      <div class="bar"><i style="width:${pr}%"></i></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px">
        <span class="muted">${pr}% complete (${completedCount}/${n} lessons)</span>
        ${pr >= 100 ? (user ? `<a class="btn sm gold" href="certificate.html?id=${encodeURIComponent(id)}&uid=${encodeURIComponent(user.uid)}">🏅 View Certificate</a>` : `<a class="btn sm gold" href="${loginRedirect}">🏅 Sign In to Claim Certificate</a>`) : ''}
      </div>
    `;

  const guestSyncBanner = (!user && enr) ? `
    <div style="margin-top:16px;padding:12px 14px;background:rgba(232,201,143,.25);border:1px solid var(--line);border-radius:12px;font-size:.82rem;line-height:1.4">
      <div style="font-weight:600;color:var(--brown);margin-bottom:4px">✨ Progress Saved Locally</div>
      <span style="color:var(--muted)">Sign in anytime to sync to the cloud across all your devices.</span>
      <div style="margin-top:8px"><a class="btn sm gold" style="font-size:.78rem;padding:4px 10px" href="${loginRedirect}">Sign in to Sync →</a></div>
    </div>
  ` : "";

  // Active Lesson Content Blocks
  const activeBlocks = Array.isArray(activeLesson.blocks) ? activeLesson.blocks : [];
  const blocksHtml = activeBlocks.length ? activeBlocks.map((sec, idx) => {
    if (sec.type === "video") {
      const vSrc = parseVideoSource(sec.url);
      let embedUrl = "";
      if (vSrc && vSrc.provider === "youtube" && vSrc.videoId) {
        embedUrl = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(vSrc.videoId)}?rel=0&modestbranding=1&playsinline=1`;
      } else if (vSrc && vSrc.embedUrl) {
        embedUrl = vSrc.embedUrl;
      } else {
        const yt = parseYouTube(sec.url);
        if (yt && yt.videoId) {
          embedUrl = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(yt.videoId)}?rel=0&modestbranding=1&playsinline=1`;
        } else {
          embedUrl = sec.url || "";
        }
      }

      return `
        <div class="section-block video-block" id="block_${idx}">
          ${sec.title ? `<h3 class="section-title">🎥 ${esc(sec.title)}</h3>` : ''}
          <div class="yt-player-container">
            <iframe
              src="${esc(embedUrl)}"
              title="${esc(sec.title || 'Lesson Video')}"
              loading="lazy"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              allowfullscreen>
            </iframe>
          </div>
        </div>
      `;
    } else if (sec.type === "photo" || sec.type === "image") {
      return `
        <div class="section-block photo-block" id="block_${idx}">
          ${sec.title ? `<h3 class="section-title">🖼️ ${esc(sec.title)}</h3>` : ''}
          <div class="photo-card">
            <img src="${esc(sec.url)}" alt="${esc(sec.title || 'Course Photo')}" loading="lazy">
            ${sec.caption ? `<div class="photo-caption">${esc(sec.caption)}</div>` : ''}
          </div>
        </div>
      `;
    } else {
      const formattedText = esc(sec.text || "").replace(/\n/g, "<br>");
      return `
        <div class="section-block matter-block" id="block_${idx}">
          ${sec.title ? `<h3 class="section-title">📝 ${esc(sec.title)}</h3>` : ''}
          <div class="matter-card">
            <div class="matter-content">${formattedText}</div>
          </div>
        </div>
      `;
    }
  }).join("") : `
    <div style="background:var(--card);border-radius:18px;padding:36px 24px;text-align:center;border:1px dashed var(--line);margin-bottom:24px">
      <div style="font-size:3rem;margin-bottom:10px">🪷</div>
      <h3 style="color:var(--maroon);font-size:1.45rem;margin-bottom:8px">Lesson Study &amp; Contemplation</h3>
      <p class="muted" style="max-width:540px;margin:0 auto 18px;font-size:.95rem;line-height:1.6">
        Contemplate the teachings of <b>${esc(activeLesson.title)}</b>. Practice svadhyaya (self-study) and reflection in accordance with traditional Gurukulam discipline.
      </p>
      ${enr ? `<button class="btn gold sm" id="btnMarkCurDone" data-l="${activeLessonIdx + 1}">${done["L" + (activeLessonIdx + 1)] ? '✓ Completed (Tap to undo)' : '✓ Mark Lesson as Done'}</button>` : ''}
    </div>
  `;

  // Syllabus list
  const syllabusHtml = lessons.map((les, idx) => {
    const isCompleted = Boolean(done["L" + (idx + 1)]);
    const isActive = (idx === activeLessonIdx);
    return `
      <div class="lesson-card-item ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}" data-lesson-idx="${idx}">
        ${enr ? `
          <input type="checkbox" class="lesson-cb" data-l="${idx + 1}" ${isCompleted ? 'checked' : ''} title="Mark lesson complete">
        ` : `
          <span style="font-size:1.1rem;margin-top:4px" title="Enroll to unlock">🔒</span>
        `}
        <div class="lesson-num-badge">${isCompleted ? '✓' : (idx + 1)}</div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
            <b class="lesson-title-text" style="font-size:.92rem;color:var(--brown)">${esc(les.title)}</b>
            ${isActive ? '<span class="tag gold" style="font-size:.65rem;flex-shrink:0">Studying</span>' : ''}
          </div>
          <div class="muted" style="font-size:.78rem;margin-top:2px">
            <span>⏱️ ${esc(les.duration || '15 mins')}</span>
            ${les.summary ? ` · ${esc(les.summary)}` : ''}
          </div>
        </div>
      </div>
    `;
  }).join("");

  const isCurDone = Boolean(done["L" + (activeLessonIdx + 1)]);
  const navHtml = `
    <div class="lesson-nav-bar">
      <button class="btn ghost sm" id="btnPrevLesson" ${activeLessonIdx <= 0 ? 'disabled style="opacity:.35;cursor:not-allowed"' : ''}>
        ← Prev Lesson
      </button>
      <div class="lesson-nav-center">
        ${enr ? `
          <button class="btn sm ${isCurDone ? 'ghost' : 'gold'}" id="btnToggleLessonDone" data-l="${activeLessonIdx + 1}">
            ${isCurDone ? '✓ Completed (Mark Incomplete)' : '✓ Mark Lesson as Done'}
          </button>
        ` : `
          <button class="btn sm gold" id="enrollFromNav">Enroll to Track Progress</button>
        `}
      </div>
      <button class="btn sm" id="btnNextLesson" ${activeLessonIdx >= n - 1 ? 'disabled style="opacity:.35;cursor:not-allowed"' : ''}>
        Next Lesson →
      </button>
    </div>
  `;

  box.innerHTML = `
    <div class="hero2">
      <div class="pic-box">
        ${course.imageUrl ? `<img src="${esc(course.imageUrl)}" alt="${esc(course.title)}" onerror="this.onerror=null;this.parentElement.innerHTML='<span style=\\'font-size:4rem\\'>${getCourseIcon(course.id)}</span>'">` : `<span style="font-size:4rem">${getCourseIcon(course.id)}</span>`}
      </div>
      <div>
        <div style="margin-bottom:8px">
          <span class="muted"><b>${n} Lessons</b></span>
        </div>
        <h1>${esc(course.title)}</h1>
        <p class="muted" style="margin:10px 0 18px;font-size:.95rem">${esc(course.desc || "")}</p>
        <div>${act}</div>
      </div>
    </div>

    <!-- Responsive Course Learning Layout -->
    <div class="course-layout">
      <!-- Active Lesson Viewer -->
      <div class="active-lesson-viewer">
        <div class="panel" style="margin-bottom:20px">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
            <span class="tag gold" style="font-weight:700">Lesson ${activeLessonIdx + 1} of ${n}</span>
            <div style="display:flex;gap:8px;align-items:center">
              <span class="muted" style="font-size:.85rem">⏱️ ${esc(activeLesson.duration || "15 mins")}</span>
              ${isCurDone ? '<span class="tag" style="background:#dcfce7;color:#166534;font-weight:700">✓ Completed</span>' : '<span class="tag" style="background:#fef3c7;color:#92400e;font-weight:700">⏳ In Progress</span>'}
            </div>
          </div>
          <h2 style="font-size:1.85rem;color:var(--maroon);line-height:1.2;margin-bottom:6px">${esc(activeLesson.title)}</h2>
          ${activeLesson.summary ? `<p class="muted" style="font-size:.92rem;margin-bottom:4px">${esc(activeLesson.summary)}</p>` : ''}
        </div>

        <!-- Active Lesson Content Blocks -->
        <div style="margin-bottom:20px">
          ${blocksHtml}
        </div>

        <!-- Lesson Navigation Bar -->
        ${navHtml}
      </div>

      <!-- Syllabus Sidebar -->
      <div class="sidebar-sticky">
        <div class="panel">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <h2 style="font-size:1.35rem;color:var(--maroon);margin:0">Course Syllabus</h2>
            <span class="muted" style="font-size:.82rem"><b>${completedCount}/${n}</b> done</span>
          </div>
          <div class="bar" style="margin:6px 0 14px"><i style="width:${pr}%"></i></div>
          <p class="muted" style="font-size:.8rem;margin-bottom:14px">Select any lesson to study its materials:</p>

          <div class="syllabus-list" style="max-height:560px;overflow-y:auto;padding-right:4px">
            ${syllabusHtml}
          </div>

          ${guestSyncBanner}
          ${!enr ? '<div style="margin-top:16px;text-align:center"><button class="btn gold sm" id="enrollSide">Enroll &amp; Start Learning</button></div>' : ''}
        </div>
      </div>
    </div>
  `;
}

async function startEnrollment() {
  if (user) {
    await set(ref(db, path()), { progress: 0, enrolledAt: Date.now(), done: {} });
  } else {
    saveGuestEnrollment(id, { progress: 0, enrolledAt: Date.now(), done: {} });
  }
  await load();
}

async function toggleLessonStatus(lessonNum, targetState = null) {
  const num = parseInt(lessonNum, 10);
  if (!num) return;

  const currentDone = Boolean(enr?.done && enr.done["L" + num]);
  const newState = targetState !== null ? targetState : !currentDone;

  const lessons = getCourseLessons(course);
  const total = lessons.length || 1;

  if (user) {
    const r = ref(db, `${path()}/done/L${num}`);
    if (newState) await set(r, true);
    else await remove(r);

    enr = (await get(ref(db, path()))).val() || {};
    const count = Object.keys(enr.done || {}).filter(k => enr.done[k]).length;
    const pr = Math.min(100, Math.round(count / total * 100));

    await update(ref(db, path()), {
      progress: pr,
      ...(pr >= 100 && !enr.completedAt ? { completedAt: Date.now() } : {})
    });
  } else {
    if (!enr) enr = { progress: 0, enrolledAt: Date.now(), done: {} };
    if (!enr.done) enr.done = {};
    if (newState) enr.done["L" + num] = true;
    else delete enr.done["L" + num];

    const count = Object.keys(enr.done).filter(k => enr.done[k]).length;
    enr.progress = Math.min(100, Math.round(count / total * 100));
    if (enr.progress >= 100 && !enr.completedAt) enr.completedAt = Date.now();
    saveGuestEnrollment(id, enr);
  }
  render();
}

box.addEventListener("click", async e => {
  // Enroll buttons
  if (e.target.id === "enroll" || e.target.id === "enrollSide" || e.target.id === "enrollFromNav") {
    e.target.disabled = true;
    e.target.textContent = "Starting Course...";
    await startEnrollment();
    return;
  }

  // Toggle lesson complete button
  const toggleBtn = e.target.closest("#btnToggleLessonDone") || e.target.closest("#btnMarkCurDone");
  if (toggleBtn) {
    const lNum = toggleBtn.dataset.l;
    await toggleLessonStatus(lNum);
    return;
  }

  // Prev lesson
  if (e.target.closest("#btnPrevLesson")) {
    if (activeLessonIdx > 0) {
      activeLessonIdx--;
      render();
      window.scrollTo({ top: document.querySelector('.active-lesson-viewer')?.offsetTop - 80 || 0, behavior: 'smooth' });
    }
    return;
  }

  // Next lesson
  if (e.target.closest("#btnNextLesson")) {
    const lessons = getCourseLessons(course);
    if (activeLessonIdx < lessons.length - 1) {
      activeLessonIdx++;
      render();
      window.scrollTo({ top: document.querySelector('.active-lesson-viewer')?.offsetTop - 80 || 0, behavior: 'smooth' });
    }
    return;
  }

  // Syllabus lesson card click
  const card = e.target.closest(".lesson-card-item");
  if (card) {
    if (e.target.classList.contains("lesson-cb")) {
      // Direct checkbox toggle
      const lNum = e.target.dataset.l;
      await toggleLessonStatus(lNum, e.target.checked);
      return;
    }
    const idx = parseInt(card.dataset.lessonIdx, 10);
    if (!isNaN(idx) && idx !== activeLessonIdx) {
      activeLessonIdx = idx;
      render();
      if (window.innerWidth < 960) {
        window.scrollTo({ top: document.querySelector('.active-lesson-viewer')?.offsetTop - 80 || 0, behavior: 'smooth' });
      }
    }
    return;
  }
});
