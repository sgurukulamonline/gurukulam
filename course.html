<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Details – Sanathana Gurukulam</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.youtube.com/iframe_api"></script>
<style>
:root{
  --cream:#F7E8C8;--sand:#E8C98F;--maroon:#7A2E16;--brown:#4A1F0E;--gold:#D99A27;
  --card:#FFF8EA;--muted:#7d5a45;--line:rgba(122,46,22,.15);--shadow:0 6px 18px rgba(74,31,14,.12);
}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{
  font-family:'Poppins',sans-serif;color:var(--brown);
  background:radial-gradient(circle at 20% 0,#fff6e0,var(--cream) 60%);min-height:100vh;
}
h1,h2,h3{font-family:'Cormorant Garamond',serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.btn{
  background:var(--maroon);color:var(--cream);padding:10px 20px;border-radius:12px;
  font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:all .2s;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.gold{background:var(--gold);color:var(--brown)}
.btn.ghost{background:none;border:1.5px solid var(--maroon);color:var(--maroon)}
.btn.sm{padding:6px 14px;font-size:.82rem}

.top{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 22px;background:var(--brown);color:var(--cream);
}
.top b{font-family:'Cormorant Garamond';font-size:1.5rem}
.top b a{color:inherit}
.top span{display:flex;gap:14px;align-items:center;font-size:.88rem}
.top a:hover{color:var(--gold)}

.wrap{max-width:1100px;margin:0 auto;padding:26px 18px 60px}

.hero2{
  display:grid;gap:24px;grid-template-columns:1fr;margin-bottom:26px;
  background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--shadow);border:1px solid var(--line);
}
@media(min-width:800px){.hero2{grid-template-columns:340px 1fr}}
.hero2 .pic-box{
  width:100%;height:220px;border-radius:16px;overflow:hidden;background:#f3e3c6;display:grid;place-items:center;
}
.hero2 img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.hero2 h1{font-size:2.5rem;color:var(--maroon);line-height:1.15}

.bar{height:10px;background:#efe0bd;border-radius:8px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e6a935,var(--gold));border-radius:8px;transition:width .3s}

.panel{background:var(--card);border-radius:20px;padding:24px;box-shadow:var(--shadow);margin-bottom:24px;border:1px solid var(--line)}
.panel h2{font-size:1.7rem;color:var(--maroon);margin-bottom:14px}

.lesson{
  display:flex;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);
  cursor:pointer;border-radius:10px;transition:background .2s;
}
.lesson:hover{background:rgba(232,201,143,.2)}
.lesson:last-child{border-bottom:0}
.lesson input{width:22px;height:22px;accent-color:var(--maroon);cursor:pointer}
.lesson.completed{color:var(--muted);text-decoration:line-through}

/* Custom Gurukulam Video Player */
.gk-video-player {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: #140702;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  margin-bottom: 24px;
  border: 1px solid rgba(217,154,39,.3);
  user-select: none;
}
.gk-video-player iframe {
  position: absolute;
  top: -12%;
  left: 0;
  width: 100%;
  height: 124%;
  pointer-events: none;
  border: 0;
}
.gk-click-overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  cursor: pointer;
}
.gk-play-overlay {
  position: absolute;
  inset: 0;
  z-index: 6;
  display: grid;
  place-items: center;
  background: rgba(30,10,3,.35);
  pointer-events: none;
  transition: opacity .3s;
}
.gk-play-overlay.hidden {
  opacity: 0;
}
.gk-big-play-btn {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: linear-gradient(135deg, #d99a27, #e8c98f);
  color: #4a1f0e;
  display: grid;
  place-items: center;
  font-size: 2rem;
  box-shadow: 0 8px 24px rgba(0,0,0,.5), 0 0 0 6px rgba(217,154,39,.35);
  padding-left: 5px;
}
.gk-controls-bar {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 10;
  background: linear-gradient(180deg, transparent, rgba(20,7,2,.85) 30%, #140702 100%);
  padding: 10px 16px 12px;
  color: #f7e8c8;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.gk-timeline-wrap {
  position: relative;
  width: 100%;
  height: 10px;
  display: flex;
  align-items: center;
  cursor: pointer;
}
.gk-timeline-track {
  position: absolute;
  left: 0;
  right: 0;
  height: 5px;
  background: rgba(255,255,255,.25);
  border-radius: 4px;
  overflow: hidden;
}
.gk-timeline-progress {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #d99a27, #f3dfb2);
  border-radius: 4px;
  transition: width .1s linear;
}
.gk-timeline-slider {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
  z-index: 2;
  margin: 0;
}
.gk-controls-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.gk-controls-left, .gk-controls-right {
  display: flex;
  align-items: center;
  gap: 10px;
}
.gk-btn {
  background: rgba(255,255,255,.12);
  color: #f7e8c8;
  border-radius: 8px;
  padding: 6px 12px;
  font-size: .85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,.15);
}
.gk-btn:hover {
  background: var(--gold);
  color: #4a1f0e;
}
.gk-time-display {
  font-size: .82rem;
  color: #e8c98f;
  font-variant-numeric: tabular-nums;
  margin-left: 4px;
}

/* Sections Styling */
.section-block {
  margin-bottom: 28px;
}
.section-title {
  font-size: 1.45rem;
  color: var(--maroon);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.photo-card {
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
}
.photo-card img {
  width: 100%;
  max-height: 480px;
  object-fit: contain;
  background: #fbf5e8;
  display: block;
}
.photo-caption {
  padding: 14px 18px;
  font-size: .92rem;
  color: var(--brown);
  border-top: 1px solid var(--line);
  background: #fffdf9;
}
.matter-card {
  background: var(--card);
  border-radius: 18px;
  padding: 22px 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  line-height: 1.7;
}
.matter-content {
  font-size: 1.02rem;
  color: #3b1709;
}

.tag{padding:3px 10px;border-radius:6px;font-size:.72rem;font-weight:600;background:#f1b36a;color:var(--brown)}
.muted{color:var(--muted);font-size:.85rem}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--brown);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0}
.bottom a{flex:1;text-align:center;color:#d9b88f;font-size:.66rem;padding:4px 0}
.bottom a span{display:block;font-size:1.3rem}
.bottom a.on{color:var(--gold);font-weight:600}
@media(min-width:900px){.bottom{max-width:720px;margin:0 auto 12px;border-radius:22px}}
</style>
</head>
<body>

<div class="top">
  <b><a href="index.html">Sanathana Gurukulam</a></b>
  <span>
    <a href="index.html">Home</a>
    <a href="courses.html">Courses</a>
    <a href="live.html">Live</a>
    <a href="community.html">Community</a>
    <a href="more.html">Explore</a>
  </span>
</div>

<div class="wrap">
  <div style="margin-bottom:14px"><a href="courses.html" style="font-size:.9rem;color:var(--muted);font-weight:500">← Back to All Courses</a></div>
  <div id="box"><p class="muted" style="text-align:center;padding:40px">Loading course details…</p></div>
</div>

<script type="module">
import { auth, db, onAuthStateChanged, ref, get, set, update, remove, esc, parseYouTube, DEFAULT_COURSES } from "./firebase-init.js";

const box = document.getElementById("box");
const id = new URLSearchParams(location.search).get("id");
let user, course, enr;
const path = () => `enrollments/${user.uid}/${id}`;

const activePlayers = {};
const activeIntervals = {};

// Ensure YouTube Iframe API is ready
const ensureYTApi = () => new Promise(resolve => {
  if (window.YT && window.YT.Player) {
    resolve(window.YT);
    return;
  }
  const prev = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = () => {
    if (typeof prev === "function") prev();
    resolve(window.YT);
  };
});

onAuthStateChanged(auth, async u => {
  user = u;
  await load();
});

const getCourseIcon = id => {
  const s = String(id || "").toLowerCase();
  if (s.includes("gita")) return "📖";
  if (s.includes("sanskrit")) return "🪷";
  if (s.includes("history")) return "📜";
  if (s.includes("ramayan")) return "🏹";
  if (s.includes("yoga")) return "🧘";
  if (s.includes("vishnu")) return "🪔";
  if (s.includes("veda")) return "🕉️";
  if (s.includes("temple")) return "🛕";
  return "🕉️";
};

async function load() {
  if (!id) {
    box.innerHTML = `<div style="text-align:center;padding:40px">
      <h2>Course Not Found</h2>
      <p class="muted" style="margin:10px 0 20px">No course ID specified.</p>
      <a class="btn" href="courses.html">Browse All Courses</a>
    </div>`;
    return;
  }

  const snap = await get(ref(db, "courses/" + id));
  course = snap.val() || DEFAULT_COURSES.find(x => x.id === id);

  if (!course) {
    box.innerHTML = `<div style="text-align:center;padding:40px">
      <h2>Course Not Found</h2>
      <p class="muted" style="margin:10px 0 20px">The course you are looking for does not exist.</p>
      <a class="btn" href="courses.html">Browse All Courses</a>
    </div>`;
    return;
  }

  enr = user ? (await get(ref(db, path()))).val() : getGuestEnrollment(id);
  render();
}

function getGuestEnrollment(cid) {
  try {
    const raw = localStorage.getItem("sg_guest_enrollments");
    return raw ? (JSON.parse(raw)[cid] || null) : null;
  } catch(e) { return null; }
}

function saveGuestEnrollment(cid, data) {
  try {
    const raw = localStorage.getItem("sg_guest_enrollments");
    const all = raw ? (JSON.parse(raw) || {}) : {};
    all[cid] = data;
    localStorage.setItem("sg_guest_enrollments", JSON.stringify(all));
  } catch(e) {}
}

function setupPlayerControls(player, idx) {
  const scrubber = document.getElementById(`scrubber_${idx}`);
  const progress = document.getElementById(`progress_${idx}`);
  const timeDisplay = document.getElementById(`timeDisplay_${idx}`);
  const playBtn = document.getElementById(`playBtn_${idx}`);
  const rewindBtn = document.getElementById(`rewindBtn_${idx}`);
  const forwardBtn = document.getElementById(`forwardBtn_${idx}`);
  const muteBtn = document.getElementById(`muteBtn_${idx}`);
  const fsBtn = document.getElementById(`fsBtn_${idx}`);
  const clickOverlay = document.getElementById(`clickOverlay_${idx}`);
  const playerWrap = document.getElementById(`playerWrap_${idx}`);

  const formatTime = sec => {
    sec = Math.floor(sec || 0);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  };

  const togglePlay = () => {
    try {
      const state = player.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        player.pauseVideo();
      } else {
        player.playVideo();
      }
    } catch(e) {
      player.playVideo();
    }
  };

  clickOverlay?.addEventListener("click", togglePlay);
  playBtn?.addEventListener("click", togglePlay);

  rewindBtn?.addEventListener("click", () => {
    const cur = player.getCurrentTime() || 0;
    player.seekTo(Math.max(0, cur - 5), true);
  });

  forwardBtn?.addEventListener("click", () => {
    const cur = player.getCurrentTime() || 0;
    const dur = player.getDuration() || 0;
    player.seekTo(Math.min(dur, cur + 5), true);
  });

  muteBtn?.addEventListener("click", () => {
    if (player.isMuted()) {
      player.unMute();
      muteBtn.textContent = "🔊";
    } else {
      player.mute();
      muteBtn.textContent = "🔇";
    }
  });

  fsBtn?.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      playerWrap?.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });

  let isSeeking = false;
  scrubber?.addEventListener("input", e => {
    isSeeking = true;
    const dur = player.getDuration() || 0;
    const val = parseFloat(e.target.value) || 0;
    const target = (val / 100) * dur;
    if (progress) progress.style.width = `${val}%`;
    if (timeDisplay) timeDisplay.textContent = `${formatTime(target)} / ${formatTime(dur)}`;
  });

  scrubber?.addEventListener("change", e => {
    const dur = player.getDuration() || 0;
    const val = parseFloat(e.target.value) || 0;
    const target = (val / 100) * dur;
    player.seekTo(target, true);
    isSeeking = false;
  });

  // Sync timeline progress
  clearInterval(activeIntervals[idx]);
  activeIntervals[idx] = setInterval(() => {
    if (isSeeking) return;
    try {
      const cur = player.getCurrentTime() || 0;
      const dur = player.getDuration() || 0;
      if (dur > 0) {
        const pct = (cur / dur) * 100;
        if (scrubber) scrubber.value = pct;
        if (progress) progress.style.width = `${pct}%`;
        if (timeDisplay) timeDisplay.textContent = `${formatTime(cur)} / ${formatTime(dur)}`;
      }
    } catch(e) {}
  }, 250);
}

async function initPlayers(sections) {
  Object.keys(activeIntervals).forEach(k => clearInterval(activeIntervals[k]));
  Object.keys(activePlayers).forEach(k => {
    try { activePlayers[k].destroy(); } catch(e) {}
  });

  await ensureYTApi();

  sections.forEach((sec, idx) => {
    if (sec.type !== "video") return;
    const yt = parseYouTube(sec.url);
    if (!yt || !yt.videoId) return;

    const elId = `yt_player_${idx}`;
    if (!document.getElementById(elId)) return;

    try {
      const player = new YT.Player(elId, {
        videoId: yt.videoId,
        playerVars: {
          controls: 0,
          modestbranding: 1,
          rel: 0,
          showinfo: 0,
          iv_load_policy: 3,
          fs: 0,
          disablekb: 1,
          playsinline: 1,
          origin: window.location.origin
        },
        events: {
          onReady: () => {
            setupPlayerControls(player, idx);
          },
          onStateChange: (event) => {
            const playOverlay = document.getElementById(`playOverlay_${idx}`);
            const playBtn = document.getElementById(`playBtn_${idx}`);
            if (event.data === YT.PlayerState.PLAYING) {
              playOverlay?.classList.add("hidden");
              if (playBtn) playBtn.textContent = "⏸";
            } else {
              playOverlay?.classList.remove("hidden");
              if (playBtn) playBtn.textContent = "▶";
            }
          }
        }
      });
      activePlayers[idx] = player;
    } catch(err) {
      console.warn("Could not initialize video player for block " + idx, err);
    }
  });
}

function render() {
  const n = course.lessons || 10;
  const done = enr?.done || {};
  const completedCount = Object.keys(done).length;
  const pr = enr ? Math.min(100, Math.round(completedCount / n * 100)) : 0;

  const loginRedirect = "login.html?redirect=" + encodeURIComponent("course.html?id=" + id);
  const act = !enr
    ? `<button class="btn gold" id="enroll">Enroll &amp; Start Learning</button>`
    : `
      <div class="bar"><i style="width:${pr}%"></i></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px">
        <span class="muted">${pr}% complete (${completedCount}/${n} lessons)</span>
        ${pr >= 100 ? (user ? `<a class="btn sm gold" href="certificate.html?id=${encodeURIComponent(id)}&uid=${encodeURIComponent(user.uid)}">🏅 View Certificate</a>` : `<a class="btn sm gold" href="${loginRedirect}">🏅 Sign In to Claim Certificate</a>`) : ''}
      </div>
    `;

  let lessonsHtml = "";
  for (let i = 1; i <= n; i++) {
    const isChecked = Boolean(done["L" + i]);
    lessonsHtml += `
      <label class="lesson ${isChecked ? 'completed' : ''}">
        ${enr ? `<input type="checkbox" data-l="${i}" ${isChecked ? "checked" : ""}>` : `<span style="font-size:1.2rem">🔒</span>`}
        <div>
          <b>Lesson ${i}: ${getLessonTitle(course.id, i)}</b>
          <div class="muted">Audio lecture, guided reading & shloka study</div>
        </div>
      </label>
    `;
  }

  const guestSyncBanner = (!user && enr) ? `
    <div style="margin-top:18px;padding:12px 16px;background:rgba(232,201,143,.25);border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <span style="font-size:.86rem;color:var(--brown)">✨ <b>Progress active:</b> Your work is saved on this device. Sign in anytime to sync to the cloud!</span>
      <a class="btn sm gold" href="${loginRedirect}">Sign in to Sync →</a>
    </div>
  ` : "";

  // Prepare dynamic sections (video, photo, matter sequence)
  let sections = Array.isArray(course.sections) && course.sections.length ? course.sections : [];
  if (!sections.length) {
    if (course.videoUrl) {
      sections.push({
        id: "sec_init_v",
        type: "video",
        title: "Introduction Lecture",
        url: course.videoUrl
      });
    }
    if (course.desc) {
      sections.push({
        id: "sec_init_m",
        type: "matter",
        title: "Course Overview & Study Guide",
        text: course.desc
      });
    }
  }

  // Render sequential sections in order
  const sectionsHtml = sections.map((sec, idx) => {
    if (sec.type === "video") {
      const yt = parseYouTube(sec.url);
      const vid = yt ? yt.videoId : "";
      return `
        <div class="section-block video-block" id="block_${idx}">
          ${sec.title ? `<h3 class="section-title">🎥 ${esc(sec.title)}</h3>` : ''}
          <div class="gk-video-player" id="playerWrap_${idx}">
            <div id="yt_player_${idx}" data-videoid="${vid}"></div>
            <div class="gk-click-overlay" id="clickOverlay_${idx}"></div>
            <div class="gk-play-overlay" id="playOverlay_${idx}">
              <div class="gk-big-play-btn">▶</div>
            </div>
            <div class="gk-controls-bar" id="controlsBar_${idx}">
              <div class="gk-timeline-wrap">
                <div class="gk-timeline-track">
                  <div class="gk-timeline-progress" id="progress_${idx}"></div>
                </div>
                <input type="range" class="gk-timeline-slider" id="scrubber_${idx}" min="0" max="100" value="0" step="0.1" aria-label="Video timeline scrubber">
              </div>
              <div class="gk-controls-row">
                <div class="gk-controls-left">
                  <button class="gk-btn" id="playBtn_${idx}" aria-label="Play or Pause">▶</button>
                  <button class="gk-btn" id="rewindBtn_${idx}" aria-label="Rewind 5 seconds">⏪ 5s</button>
                  <button class="gk-btn" id="forwardBtn_${idx}" aria-label="Forward 5 seconds">5s ⏩</button>
                  <span class="gk-time-display" id="timeDisplay_${idx}">00:00 / 00:00</span>
                </div>
                <div class="gk-controls-right">
                  <button class="gk-btn" id="muteBtn_${idx}" aria-label="Mute or Unmute">🔊</button>
                  <button class="gk-btn" id="fsBtn_${idx}" aria-label="Fullscreen">⛶</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    } else if (sec.type === "photo" || sec.type === "image") {
      return `
        <div class="section-block photo-block" id="block_${idx}">
          ${sec.title ? `<h3 class="section-title">🖼️ ${esc(sec.title)}</h3>` : ''}
          <div class="photo-card">
            <img src="${esc(sec.url)}" alt="${esc(sec.title || 'Course Photo')}" loading="lazy">
            ${sec.caption ? `<div class="photo-caption">${esc(sec.caption)}</div>` : ''}
          </div>
        </div>
      `;
    } else {
      const formattedText = esc(sec.text || "").replace(/\n/g, "<br>");
      return `
        <div class="section-block matter-block" id="block_${idx}">
          ${sec.title ? `<h3 class="section-title">📝 ${esc(sec.title)}</h3>` : ''}
          <div class="matter-card">
            <div class="matter-content">${formattedText}</div>
          </div>
        </div>
      `;
    }
  }).join("");

  box.innerHTML = `
    <div class="hero2">
      <div class="pic-box">
        ${course.imageUrl ? `<img src="${esc(course.imageUrl)}" alt="${esc(course.title)}" onerror="this.onerror=null;this.parentElement.innerHTML='<span style=\\'font-size:4rem\\'>${getCourseIcon(course.id)}</span>'">` : `<span style="font-size:4rem">${getCourseIcon(course.id)}</span>`}
      </div>
      <div>
        <div style="margin-bottom:8px">
          <span class="tag">${course.type === "free" ? "Free" : "Paid"}</span>
          <span class="muted" style="margin-left:8px">${n} lessons</span>
        </div>
        <h1>${esc(course.title)}</h1>
        <p class="muted" style="margin:10px 0 18px;font-size:.95rem">${esc(course.desc || "")}</p>
        <div>${act}</div>
      </div>
    </div>

    <!-- Course Dynamic Content Sequence (Custom Video Player, Photos, and Matter) -->
    <div style="margin-bottom:28px">
      ${sectionsHtml}
    </div>

    <div class="panel">
      <h2>Course Modules & Lessons</h2>
      ${lessonsHtml}
      ${guestSyncBanner}
      ${enr ? '' : '<p class="muted" style="margin-top:16px">Click Enroll &amp; Start Learning to track your daily progress and unlock lesson checkboxes.</p>'}
    </div>
  `;

  // Initialize YouTube API players with custom controls
  initPlayers(sections);
}

function getLessonTitle(courseId, num) {
  const titles = {
    "bhagavad-gita": ["Arjuna Vishada Yoga", "Sankhya Yoga & Immortality", "Karma Yoga & Selfless Action", "Jnana Karma Sannyasa Yoga", "Karma Sannyasa Yoga", "Dhyana Yoga & Meditation", "Jnana Vijnana Yoga", "Akshara Brahma Yoga", "Raja Vidya Raja Guhya", "Vibhuti Yoga", "Vishwaroopa Darshana", "Bhakti Yoga & Beyond"],
    "sanskrit-basics": ["Varnamala (Vowels & Consonants)", "Pronunciation & Sthana", "Basic Nouns & Pronouns", "Simple Verbs in Present Tense", "Sandhi Foundations", "Shloka Chanting Metres", "Everyday Gurukulam Conversation", "Subhashitas Recitation"]
  };
  const list = titles[courseId];
  return (list && list[num - 1]) || `Module ${num} - Core Concept & Practice`;
}

box.addEventListener("click", async e => {
  if (e.target.id !== "enroll") return;
  e.target.disabled = true;
  e.target.textContent = "Starting Course...";

  if (user) {
    await set(ref(db, path()), { progress: 0, enrolledAt: Date.now(), done: {} });
  } else {
    saveGuestEnrollment(id, { progress: 0, enrolledAt: Date.now(), done: {} });
  }
  await load();
});

box.addEventListener("change", async e => {
  const i = e.target.dataset.l;
  if (!i) return;

  if (user) {
    const r = ref(db, `${path()}/done/L${i}`);
    if (e.target.checked) await set(r, true);
    else await remove(r);

    enr = (await get(ref(db, path()))).val() || {};
    const total = course.lessons || 10;
    const count = Object.keys(enr.done || {}).length;
    const pr = Math.min(100, Math.round(count / total * 100));

    await update(ref(db, path()), {
      progress: pr,
      ...(pr >= 100 && !enr.completedAt ? { completedAt: Date.now() } : {})
    });
  } else {
    // Offline/guest progress on this device
    if (!enr) enr = { progress: 0, enrolledAt: Date.now(), done: {} };
    if (!enr.done) enr.done = {};
    if (e.target.checked) enr.done["L" + i] = true;
    else delete enr.done["L" + i];

    const total = course.lessons || 10;
    const count = Object.keys(enr.done).length;
    enr.progress = Math.min(100, Math.round(count / total * 100));
    if (enr.progress >= 100 && !enr.completedAt) enr.completedAt = Date.now();
    saveGuestEnrollment(id, enr);
  }
  await load();
});
</script>
