<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate of Completion – Sanathana Gurukulam</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7E8C8;--sand:#E8C98F;--maroon:#7A2E16;--brown:#4A1F0E;--gold:#D99A27;
  --card:#FFF8EA;--muted:#7d5a45;--line:rgba(122,46,22,.15);--shadow:0 6px 18px rgba(74,31,14,.12);
}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{
  font-family:'Poppins',sans-serif;color:var(--brown);
  background:radial-gradient(circle at 20% 0,#fff6e0,var(--cream) 60%);min-height:100vh;
}
h1,h2,h3{font-family:'Cormorant Garamond',serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.btn{
  background:var(--maroon);color:var(--cream);padding:10px 22px;border-radius:12px;
  font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.gold{background:var(--gold);color:var(--brown)}
.btn.ghost{background:none;border:1.5px solid var(--maroon);color:var(--maroon)}
.btn.sm{padding:6px 14px;font-size:.82rem}

.top{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 22px;background:var(--brown);color:var(--cream);
}
.top b{font-family:'Cormorant Garamond';font-size:1.5rem}
.top b a{color:inherit}
.top span{display:flex;gap:14px;align-items:center;font-size:.88rem}
.top a:hover{color:var(--gold)}

.wrap{max-width:960px;margin:30px auto 60px;padding:0 18px}

.cert{
  max-width:840px;margin:20px auto 30px;background:#fffdf7;
  border:14px double var(--gold);padding:60px 40px;text-align:center;
  box-shadow:0 10px 30px rgba(74,31,14,.15);border-radius:8px;position:relative;
}
.cert::before{
  content:"";position:absolute;inset:8px;border:1.5px solid rgba(122,46,22,.2);pointer-events:none;
}
.cert .logo-mark{font-size:3.5rem;line-height:1;margin-bottom:6px}
.cert .inst{font-family:'Cormorant Garamond';font-size:1.6rem;letter-spacing:2px;color:var(--brown);text-transform:uppercase;font-weight:700}
.cert h1{font-size:3.2rem;color:var(--maroon);margin:16px 0 10px}
.cert .tagline{font-style:italic;color:var(--muted);font-size:1rem;margin-bottom:24px}
.cert .recipient{font-family:'Cormorant Garamond';font-size:2.8rem;color:var(--maroon);border-bottom:2px solid var(--gold);display:inline-block;padding:0 24px 6px;margin:8px 0 16px}
.cert .c-title{font-size:2rem;color:var(--brown);margin:8px 0 20px}
.cert .date{color:var(--muted);font-size:.95rem;margin-top:20px}

.cert-footer{display:flex;justify-content:space-around;margin-top:40px;padding-top:24px;border-top:1px dashed var(--line)}
.cert-footer div{text-align:center}
.cert-footer b{display:block;font-family:'Cormorant Garamond';font-size:1.2rem;color:var(--maroon)}
.cert-footer small{color:var(--muted);font-size:.8rem}

.actions{display:flex;justify-content:center;gap:14px;margin-top:20px}

@media print{
  .top,.noprint{display:none!important}
  body{background:#fff}
  .cert{box-shadow:none;border-width:8px;margin:0}
}
</style>
</head>
<body>

<div class="top">
  <b><a href="index.html">Sanathana Gurukulam</a></b>
  <span>
    <a href="courses.html">Courses</a>
    <a href="live.html">Live</a>
    <a href="community.html">Community</a>
    <a href="dashboard.html">Dashboard</a>
  </span>
</div>

<div class="wrap">
  <div id="box">
    <p style="text-align:center;color:var(--muted);padding:40px">Verifying completion credentials…</p>
  </div>
</div>

<script type="module">
import { requireUser, db, ref, get, esc, DEFAULT_COURSES } from "./firebase-init.js";

const box = document.getElementById("box");
const id = new URLSearchParams(location.search).get("id");

requireUser(async (u, p) => {
  if (!id) {
    box.innerHTML = `<div style="text-align:center;padding:40px">
      <h2>No Course Specified</h2>
      <p style="color:var(--muted);margin:10px 0 20px">Please select a course from your dashboard.</p>
      <a class="btn" href="dashboard.html">Back to Dashboard</a>
    </div>`;
    return;
  }

  const [c, e] = await Promise.all([
    get(ref(db, "courses/" + id)),
    get(ref(db, `enrollments/${u.uid}/${id}`))
  ]);

  const course = c.val() || DEFAULT_COURSES.find(x => x.id === id);
  const enr = e.val();

  if (!course || !enr || (enr.progress || 0) < 100) {
    const pr = enr?.progress || 0;
    box.innerHTML = `<div style="text-align:center;padding:40px;background:#fff;border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow)">
      <div style="font-size:3rem;margin-bottom:10px">🔒</div>
      <h2>Certificate Not Yet Unlocked</h2>
      <p style="color:var(--muted);margin:10px 0 16px">You have completed <b>${pr}%</b> of <b>${esc(course ? course.title : "this course")}</b>. Complete all lessons to unlock your official Gurukulam certificate!</p>
      <div style="display:flex;justify-content:center;gap:12px">
        <a class="btn" href="course.html?id=${encodeURIComponent(id)}">Continue Course</a>
        <a class="btn ghost" href="dashboard.html">Return to Dashboard</a>
      </div>
    </div>`;
    return;
  }

  const d = new Date(enr.completedAt || Date.now()).toLocaleDateString("en-IN", {
    day: "numeric", month: "long", year: "numeric"
  });

  box.innerHTML = `
    <div class="cert">
      <div class="logo-mark">🕉️</div>
      <div class="inst">Sanathana Gurukulam</div>
      <p class="tagline">Ancient Wisdom • Modern Learning • Timeless Values</p>

      <h1>Certificate of Completion</h1>
      <p style="color:var(--muted)">This is proudly awarded to</p>

      <div class="recipient">${esc(p.name || u.displayName || "Sadhaka")}</div>

      <p style="color:var(--muted)">for successfully mastering all modules and fulfilling all requirements of</p>
      <h2 class="c-title">${esc(course.title)}</h2>

      <p class="date">Conferred on <b>${d}</b></p>

      <div class="cert-footer">
        <div>
          <b>Acharya Dr. Srinivas Sharma</b>
          <small>Chief Acharya</small>
        </div>
        <div>
          <span style="font-size:2rem">🪷</span>
          <br><small>Gurukulam Vidya Peetham</small>
        </div>
        <div>
          <b>Acharya Veda Prakash</b>
          <small>Head of Traditional Studies</small>
        </div>
      </div>
    </div>

    <div class="actions noprint">
      <button class="btn gold" onclick="window.print()">🖨️ Print / Save as PDF</button>
      <a class="btn ghost" href="dashboard.html">← Back to Dashboard</a>
    </div>
  `;
});
</script>
</body>
</html>
