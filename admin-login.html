<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login – Sanathana Gurukulam</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7E8C8;--sand:#E8C98F;--maroon:#7A2E16;--brown:#4A1F0E;--gold:#D99A27;
  --card:#FFFDF8;--muted:#7d5a45;--line:rgba(122,46,22,.15);--shadow:0 14px 38px rgba(32,11,3,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;color:var(--brown);
  background:radial-gradient(circle at 50% 15%,#3a1506 0%,#180802 100%);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:20px;
}
h1,h2,h3{font-family:'Cormorant Garamond',serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
input{
  font:inherit;padding:14px 16px;border:1.5px solid rgba(122,46,22,0.2);
  border-radius:12px;background:#fff;color:var(--brown);width:100%;
  font-size:.95rem;transition:border-color .2s,box-shadow .2s;
}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,154,39,0.25)}

.card{
  max-width:400px;width:100%;
  background:var(--card);border-radius:24px;padding:38px 30px 32px;
  box-shadow:var(--shadow);border:1px solid rgba(217,154,39,0.35);
  text-align:center;position:relative;overflow:hidden;
}
.card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg,var(--maroon),var(--gold),var(--maroon));
}
.seal{
  width:58px;height:58px;margin:0 auto 12px;border-radius:50%;
  background:linear-gradient(135deg,#93361a,#4a1f0e);
  color:var(--gold);display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;box-shadow:0 4px 14px rgba(74,31,14,.25);
  border:2px solid var(--gold);
}
h1{font-size:2.1rem;color:var(--maroon);line-height:1.15;letter-spacing:.3px}
p.sub{color:var(--muted);font-size:.85rem;margin:6px 0 22px}

.form-group{margin-bottom:16px;text-align:left}
.form-group label{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px;color:var(--brown);letter-spacing:.2px}
.input-wrap{position:relative}
.pw-toggle{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.05rem;
  padding:4px;
}

.btn{
  background:linear-gradient(135deg,#e3a32f,#bf7b13);color:#2d1105;
  padding:14px 22px;border-radius:12px;font-weight:700;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s;font-size:1rem;width:100%;
  box-shadow:0 6px 18px rgba(217,154,39,0.3);margin-top:6px;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 8px 22px rgba(217,154,39,0.4)}
.btn:disabled{opacity:.7;transform:none;cursor:not-allowed}

#msg{
  font-size:.85rem;margin-top:14px;padding:11px 14px;border-radius:10px;display:none;line-height:1.4;
  text-align:left;
}
#msg.err{background:#fee2e2;color:#991b1b;border:1px solid #f87171;display:block}
#msg.succ{background:#dcfce7;color:#166534;border:1px solid #86efac;display:block}
#msg.warn{background:#fef3c7;color:#92400e;border:1px solid #fcd34d;display:block}

.back-link{
  display:inline-block;margin-top:20px;font-size:.82rem;color:var(--muted);transition:color .2s;
}
.back-link:hover{color:var(--maroon);text-decoration:underline}
</style>
</head>
<body>

<div class="card">
  <div class="seal">👑</div>
  <h1>Acharya Peetham</h1>
  <p class="sub">Administrator Portal</p>

  <form id="adminForm" novalidate>
    <div class="form-group">
      <label for="adminUser">Email or Username</label>
      <input type="text" id="adminUser" placeholder="name@gurukulam.org" required autocomplete="username" spellcheck="false">
    </div>

    <div class="form-group">
      <label for="adminPass">Password</label>
      <div class="input-wrap">
        <input type="password" id="adminPass" placeholder="Enter password" required autocomplete="current-password">
        <button type="button" class="pw-toggle" id="btnTogglePw" aria-label="Toggle password visibility">👁️</button>
      </div>
    </div>

    <button type="submit" class="btn" id="btnSubmit">Sign In →</button>
  </form>

  <div id="msg"></div>

  <a class="back-link" href="index.html">← Back to Gurukulam</a>
</div>

<script type="module">
import { signInAdminWithEmail, auth, onAuthStateChanged, ensureProfile } from "./firebase-init.js";

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);

const showMsg = (txt, type) => {
  const m = $("msg");
  m.textContent = txt;
  m.className = type;
  m.style.display = "block";
};

// Subtle alert if redirected from admin.html
if (params.get("unauthorized") === "1") {
  showMsg("Administrator access required. Please sign in.", "warn");
}

// Password toggle
const pwInput = $("adminPass");
const btnToggle = $("btnTogglePw");
btnToggle.onclick = () => {
  if (pwInput.type === "password") {
    pwInput.type = "text";
    btnToggle.textContent = "🙈";
  } else {
    pwInput.type = "password";
    btnToggle.textContent = "👁️";
  }
};

// Auto redirect if already admin
onAuthStateChanged(auth, async u => {
  if (u) {
    try {
      const prof = await ensureProfile(u);
      if (prof && prof.role === "admin") {
        location.href = "admin.html";
      }
    } catch(e) {}
  }
});

$("adminForm").onsubmit = async (e) => {
  e.preventDefault();
  const userOrEmail = $("adminUser").value.trim();
  const pass = $("adminPass").value.trim();

  if (!userOrEmail || !pass) {
    showMsg("Please enter both email and password.", "err");
    return;
  }

  const btn = $("btnSubmit");
  btn.disabled = true;
  btn.textContent = "Signing In...";

  try {
    await signInAdminWithEmail(userOrEmail, pass);
    showMsg("Authentication successful. Redirecting...", "succ");
    setTimeout(() => {
      location.href = "admin.html";
    }, 400);
  } catch (err) {
    console.error("Admin Login Error:", err);
    btn.disabled = false;
    btn.textContent = "Sign In →";
    showMsg(err.message || "Invalid email or password.", "err");
  }
};
</script>

</body>
</html>
