<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login – Sanathana Gurukulam</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7E8C8;--sand:#E8C98F;--maroon:#7A2E16;--brown:#4A1F0E;--gold:#D99A27;
  --card:#FFF8EA;--muted:#7d5a45;--line:rgba(122,46,22,.15);--shadow:0 6px 18px rgba(74,31,14,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;color:var(--brown);
  background:radial-gradient(circle at 20% 0,#fff6e0,var(--cream) 60%);min-height:100vh;
  display:flex;flex-direction:column;
}
h1,h2,h3{font-family:'Cormorant Garamond',serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
input,textarea{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--brown);width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.btn{
  background:var(--maroon);color:var(--cream);padding:12px 20px;border-radius:12px;
  font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.gold{background:var(--gold);color:var(--brown)}
.btn.ghost{background:none;border:1.5px solid var(--maroon);color:var(--maroon)}
.btn.full{width:100%}
.btn.sm{padding:6px 14px;font-size:.85rem}

.top{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 22px;background:var(--brown);color:var(--cream);
}
.top b{font-family:'Cormorant Garamond';font-size:1.5rem}
.top b a{color:inherit}
.top span{display:flex;gap:14px;align-items:center;font-size:.88rem}
.top a:hover{color:var(--gold)}

.container{
  max-width:440px;width:92%;margin:40px auto 60px;
  background:var(--card);border-radius:24px;padding:32px 26px;box-shadow:var(--shadow);
  border:1px solid var(--line);text-align:center;
}
.container .logo-symbol{font-size:2.8rem;margin-bottom:8px}
.container h1{font-size:2.4rem;color:var(--maroon);line-height:1.1}
.container p.sub{color:var(--muted);font-size:.9rem;margin:8px 0 22px}

.stack{display:grid;gap:12px}
.tag{padding:3px 10px;border-radius:6px;font-size:.75rem;font-weight:600;background:#f1b36a;color:var(--brown)}
.card-active{background:#fff;border-radius:14px;padding:16px;border:1px solid var(--line);margin-bottom:16px}
#msg{font-size:.85rem;margin-top:12px;padding:8px 12px;border-radius:8px;display:none}
#msg.err{background:#fee2e2;color:#991b1b;display:block}
#msg.succ{background:#dcfce7;color:#166534;display:block}

html,body{overflow-x:hidden;max-width:100%}
@media(max-width:480px){
  .top{padding:10px 14px}
  .top b{font-size:1.25rem}
  .top span a{font-size:.82rem}
  .container{
    margin:18px auto 36px;
    padding:22px 16px;
    width:94%;
    border-radius:20px;
  }
  .container .logo-symbol{font-size:2.3rem;margin-bottom:4px}
  .container h1{font-size:2rem}
  .container p.sub{font-size:.84rem;margin:6px 0 16px}
  .btn{padding:11px 16px;font-size:.92rem}
}

</style>
</head>
<body>

<div class="top">
  <b><a href="index.html">Sanathana Gurukulam</a></b>
  <span>
    <a href="index.html">Home</a>
    <a href="courses.html">Courses</a>
    <a href="live.html">Live</a>
    <a href="community.html">Community</a>
    
  </span>
</div>

<div class="container">
  <div class="logo-symbol">🕉️</div>
  <h1>Namaste</h1>
  <p class="sub">Sign in with your mobile number to access courses &amp; sadhana</p>

  <div id="alreadyIn" style="display:none" class="card-active">
    <p style="font-weight:600;margin-bottom:4px" id="loggedName">Logged in</p>
    <p style="font-size:.85rem;color:var(--muted);margin-bottom:14px" id="loggedRole">Role: Learner</p>
    <div class="stack">
      <a class="btn gold full" id="goDash" href="dashboard.html">Enter Learning Portal →</a>
      <button class="btn ghost full" id="btnSwitch" type="button">Sign Out / Switch Account</button>
    </div>
  </div>

  <div id="loginForms">
    <div class="stack">
      <!-- Mobile OTP Login -->
      <button class="btn gold full" id="btnMsg91Otp" type="button" style="font-size:1.05rem;padding:15px;box-shadow:0 6px 18px rgba(217,154,39,0.35);font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px">
        <span style="font-size:1.25rem">📱</span> Login with Mobile OTP
      </button>
      <p style="font-size:.82rem;color:var(--muted);margin-top:2px">Receive instant OTP on your phone to continue</p>
    </div>
  </div>

  <div id="msg"></div>
</div>

<!-- MSG91 Secure OTP Widget Integration -->
<script>
window.MSG91_OTP_CONFIG = {
  widgetId: "366a63635436303737343431",
  tokenAuth: "577606TCx2hboqS6ac07bceP1",
  success: (data) => {
    console.log("MSG91 OTP Success:", data);
    if (window.handleOtpSuccess) window.handleOtpSuccess(data);
  },
  failure: (error) => {
    console.error("MSG91 OTP Error:", error);
    if (window.handleOtpFailure) window.handleOtpFailure(error);
  }
};
</script>
<script async src="https://verify.msg91.com/otp-provider.js"></script>

<script type="module">
import { auth, onAuthStateChanged, logout, setMockUser, getMockUser, ensureProfile, db, ref, update } from "./firebase-init.js";

const params = new URLSearchParams(location.search);
const redirect = params.get("redirect") ? decodeURIComponent(params.get("redirect")) : "dashboard.html";

const $ = id => document.getElementById(id);
const showMsg = (txt, isErr) => {
  const m = $("msg");
  m.textContent = txt;
  m.className = isErr ? "err" : "succ";
};

// Expose MSG91 OTP handlers
window.handleOtpSuccess = async (data) => {
  let verifiedPhone = "";
  let verifiedEmail = "";

  if (typeof data === "string" && data.startsWith("eyJ")) {
    try {
      const base64Url = data.split(".")[1];
      const base64 = base64Url.replace(/-/g, "+").replace(/_/g, "/");
      const jsonPayload = decodeURIComponent(atob(base64).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
      const payload = JSON.parse(jsonPayload);
      console.log("Verified JWT payload:", payload);
      verifiedPhone = payload.mobile || payload.identifier || payload.mobileNumber || payload.sub || "";
      verifiedEmail = payload.email || "";
    } catch (e) {
      console.warn("Could not decode JWT payload:", e);
    }
  } else if (typeof data === "object" && data !== null) {
    verifiedPhone = data.mobile || data.identifier || data.phoneNumber || data.message || "";
    verifiedEmail = data.email || "";
  }

  const cleanDigits = String(verifiedPhone).replace(/\D/g, "");
  const uid = cleanDigits ? ("ph_" + cleanDigits) : ("ph_" + Date.now().toString(36));
  const displayName = cleanDigits ? ("Sadhaka (" + cleanDigits.slice(-4) + ")") : "Sadhaka";
  const formattedPhone = cleanDigits ? ("+91 " + cleanDigits.slice(-10)) : (verifiedPhone || "");
  const email = verifiedEmail || "";

  const userObj = {
    uid,
    displayName,
    email,
    phoneNumber: formattedPhone,
    role: "learner",
    authProvider: "msg91_otp"
  };

  setMockUser(userObj);

  try {
    await ensureProfile(userObj);
  } catch (err) {
    console.warn("ensureProfile fallback:", err);
  }

  showMsg("Namaste! Mobile OTP verified successfully. Redirecting to Gurukulam...", false);
  const btn = $("btnMsg91Otp");
  if (btn) btn.innerHTML = "<span>✅</span> Verified! Redirecting...";
  setTimeout(() => location.href = redirect, 800);
};

window.handleOtpFailure = (error) => {
  console.error("OTP Failure handler:", error);
  const errMsg = (error && (error.message || error.description)) || "OTP verification was cancelled or failed. Please try again.";
  showMsg(errMsg, true);
  const btn = $("btnMsg91Otp");
  if (btn) btn.innerHTML = "<span>📱</span> Login with Mobile OTP";
};

// Wire up the MSG91 Login Button
const btnOtp = $("btnMsg91Otp");
if (btnOtp) {
  btnOtp.onclick = () => {
    btnOtp.innerHTML = '<span>⏳</span> Opening Mobile OTP...';
    showMsg("Opening secure mobile verification window...", false);

    const triggerWidget = () => {
      try {
        if (typeof window.initSendOTP === "function") {
          window.initSendOTP(window.MSG91_OTP_CONFIG);
          setTimeout(() => {
            btnOtp.innerHTML = '<span>📱</span> Login with Mobile OTP';
          }, 1500);
        } else {
          throw new Error("OTP service is still loading, please click again in a moment.");
        }
      } catch (err) {
        console.error(err);
        showMsg(err.message || "Failed to launch OTP service", true);
        btnOtp.innerHTML = '<span>📱</span> Login with Mobile OTP';
      }
    };

    if (typeof window.initSendOTP === "function") {
      triggerWidget();
    } else {
      let tries = 0;
      const t = setInterval(() => {
        tries++;
        if (typeof window.initSendOTP === "function") {
          clearInterval(t);
          triggerWidget();
        } else if (tries > 20) {
          clearInterval(t);
          showMsg("Could not connect to MSG91 OTP service. Please check your internet connection.", true);
          btnOtp.innerHTML = '<span>📱</span> Login with Mobile OTP';
        }
      }, 200);
    }
  };
}

// Check if already signed in
onAuthStateChanged(auth, async u => {
  if (u) {
    const prof = await ensureProfile(u);
    $("alreadyIn").style.display = "block";
    $("loginForms").style.display = "none";
    $("loggedName").textContent = "Signed in as: " + (prof.name || u.displayName || "Learner");
    $("loggedRole").textContent = "Role: " + (prof.role === "admin" ? "Admin" : "Learner");
    $("goDash").href = redirect;
  } else {
    $("alreadyIn").style.display = "none";
    $("loginForms").style.display = "block";
  }
});



// Switch account
$("btnSwitch").onclick = async () => {
  await logout();
  $("alreadyIn").style.display = "none";
  $("loginForms").style.display = "block";
  showMsg("Signed out. Click above to login with your mobile number.", false);
};
</script>
</body>
</html>
