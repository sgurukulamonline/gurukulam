<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dashboard – Sanathana Gurukulam</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#F7E8C8;--sand:#E8C98F;--maroon:#7A2E16;--brown:#4A1F0E;--gold:#D99A27;--card:#FFF8EA;--muted:#7d5a45;--line:rgba(122,46,22,.15);--shadow:0 6px 18px rgba(74,31,14,.12)}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{font-family:'Poppins',sans-serif;color:var(--brown);background:radial-gradient(circle at 20% 0,#fff6e0,var(--cream) 60%);min-height:100vh}
h1,h2,h3{font-family:'Cormorant Garamond',serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0}
input,select{font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--brown);width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--maroon);color:var(--cream);padding:10px 20px;border-radius:12px;font-weight:500}
.btn.gold{background:var(--gold);color:var(--brown)}.btn.ghost{background:none;border:1px solid var(--maroon);color:var(--maroon)}.btn.sm{padding:5px 12px;font-size:.8rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 22px;background:var(--brown);color:var(--cream)}
.top b{font-family:'Cormorant Garamond';font-size:1.5rem}.top span{display:flex;gap:14px;align-items:center;font-size:.88rem}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}.wrap>h1{font-size:2.3rem;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);font-size:.85rem;color:var(--muted)}
.stat b{display:block;font-family:'Cormorant Garamond';font-size:2.3rem;color:var(--maroon)}
.panel{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:22px}.panel h2{font-size:1.6rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;height:110px;object-fit:cover;border-radius:10px}
.bar{height:8px;background:#efe0bd;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.muted{color:var(--muted);font-size:.85rem}.tag{padding:2px 10px;border-radius:6px;font-size:.72rem;font-weight:600;background:#f1b36a}
.login{max-width:400px;margin:8vh auto;background:var(--card);border-radius:22px;padding:28px;box-shadow:var(--shadow);text-align:center}
.login h1{font-size:2.2rem}.login .stack{display:grid;gap:12px;margin-top:16px}.login hr{border:0;border-top:1px solid var(--line);margin:18px 0}
#msg{margin-top:14px;font-size:.85rem;color:var(--maroon)}
</style></head><body>
<div class="top"><b>Sanathana Gurukulam</b><span><a href="index.html">Home</a><a href="admin.html" id="adminLink" hidden>Admin</a><button class="btn gold sm" id="out">Logout</button></span></div>
<div class="wrap">
  <h1 id="hello">Namaste</h1>
  <div class="stats">
    <div class="stat"><b id="sE">0</b>Courses enrolled</div><div class="stat"><b id="sD">0</b>Completed</div>
    <div class="stat"><b id="sA">0%</b>Average progress</div><div class="stat"><b id="sL">0</b>Upcoming live classes</div>
  </div>
  <div class="panel"><h2>My Courses</h2><div class="grid" id="mine"></div></div>
  <div class="panel"><h2>Live Classes</h2><div id="live"></div></div>
  <div class="panel"><h2>Explore Courses</h2><div class="grid" id="all"></div></div>
</div>
<script type="module">
import { db, requireUser, logout, esc, ref, get, set, update, list } from "./firebase-init.js";
const $ = id => document.getElementById(id);
const when = t => new Date(t).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });
let me, courses = [], enr = {};
$("out").onclick = logout;

requireUser((u, p) => {
  me = u;
  $("hello").textContent = "Namaste, " + (p.name || "Learner");
  $("adminLink").hidden = p.role !== "admin";
  load();
});

const card = (c, extra) => `<div class="card">${c.imageUrl ? `<img src="${esc(c.imageUrl)}" alt="">` : ""}
  <a href="course.html?id=${esc(c.id)}"><b>${esc(c.title)}</b></a><p class="muted">${esc(c.desc || "")}</p>
  <div><span class="tag">${c.type === "free" ? "Free" : "Paid"}</span> <span class="muted">${c.lessons || 0} lessons</span></div>${extra}</div>`;

async function load() {
  const [cs, en, ls] = await Promise.all([list("courses"), get(ref(db, "enrollments/" + me.uid)), list("liveClasses")]);
  courses = cs.filter(c => c.published === true);
  enr = en.val() || {};
  const mine = courses.filter(c => enr[c.id]), rest = courses.filter(c => !enr[c.id]);
  const prog = c => enr[c.id].progress || 0;

  $("mine").innerHTML = mine.map(c => card(c, `<div class="bar"><i style="width:${prog(c)}%"></i></div>
    <div class="row" style="border:0;padding:0"><span class="muted">${prog(c)}%</span>
    ${prog(c) >= 100 ? `<a class="btn sm" href="certificate.html?id=${esc(c.id)}">🏅 Certificate</a>` : `<a class="btn sm" href="course.html?id=${esc(c.id)}">Continue</a>`}</div>`)).join("")
    || '<p class="muted">You have not enrolled in any course yet. Pick one below.</p>';
  $("all").innerHTML = rest.map(c => card(c, `<button class="btn sm" data-enroll="${esc(c.id)}">Enroll</button>`)).join("")
    || '<p class="muted">No more courses right now.</p>';

  const live = ls.filter(c => c.startsAt >= Date.now()).sort((a, b) => a.startsAt - b.startsAt);
  $("live").innerHTML = live.map(c => `<div class="row"><span><b>${esc(c.title)}</b><br><span class="muted">${esc(c.teacher || "")} · ${when(c.startsAt)}</span></span>
    ${/^https?:\/\//.test(c.link || "") ? `<a class="btn sm" href="${esc(c.link)}" target="_blank" rel="noopener">Join</a>` : ""}</div>`).join("")
    || '<p class="muted">No upcoming live classes.</p>';

  $("sE").textContent = mine.length;
  $("sD").textContent = mine.filter(c => prog(c) >= 100).length;
  $("sA").textContent = (mine.length ? Math.round(mine.reduce((s, c) => s + prog(c), 0) / mine.length) : 0) + "%";
  $("sL").textContent = live.length;
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  const id = b.dataset.enroll || b.dataset.step; if (!id) return;
  b.disabled = true;
  const r = ref(db, `enrollments/${me.uid}/${id}`);
  if (b.dataset.enroll) await set(r, { progress: 0, enrolledAt: Date.now() });
  else {
    const c = courses.find(x => x.id === id);
    await update(r, { progress: Math.min(100, (enr[id].progress || 0) + Math.ceil(100 / (c.lessons || 10))) });
  }
  load();
});
</script>
</body></html>
