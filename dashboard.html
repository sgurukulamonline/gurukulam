<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Dashboard – Sanathana Gurukulam</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F7E8C8;--sand:#E8C98F;--maroon:#7A2E16;--brown:#4A1F0E;--gold:#D99A27;
  --card:#FFF8EA;--muted:#7d5a45;--line:rgba(122,46,22,.15);--shadow:0 6px 18px rgba(74,31,14,.12);
}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{
  font-family:'Poppins',sans-serif;color:var(--brown);
  background:radial-gradient(circle at 20% 0,#fff6e0,var(--cream) 60%);min-height:100vh;
}
h1,h2,h3{font-family:'Cormorant Garamond',serif}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0}
input,select{font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--brown);width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.btn{
  background:var(--maroon);color:var(--cream);padding:9px 18px;border-radius:12px;
  font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:all .2s;text-align:center;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.gold{background:var(--gold);color:var(--brown);font-weight:600}
.btn.ghost{background:none;border:1px solid var(--maroon);color:var(--maroon)}
.btn.sm{padding:6px 14px;font-size:.82rem}

.top{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:14px 22px;background:var(--brown);color:var(--cream);
}
.top b{font-family:'Cormorant Garamond';font-size:1.5rem}
.top b a{color:inherit}
.top span{display:flex;gap:14px;align-items:center;font-size:.88rem}
.top a:hover{color:var(--gold)}

.wrap{max-width:1100px;margin:0 auto;padding:26px 18px 60px}
.header-row{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px;margin-bottom:20px}
.wrap h1{font-size:2.4rem;color:var(--maroon);line-height:1.1}
.wrap p.sub{color:var(--muted);font-size:.92rem}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:26px}
.stat{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);font-size:.85rem;color:var(--muted);border:1px solid var(--line)}
.stat b{display:block;font-family:'Cormorant Garamond';font-size:2.4rem;color:var(--maroon);line-height:1.1;margin-bottom:4px}

.panel{background:var(--card);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:24px;border:1px solid var(--line)}
.panel h2{font-size:1.7rem;color:var(--maroon);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 8px rgba(74,31,14,.06);transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card .pic-holder{width:100%;height:130px;border-radius:12px;overflow:hidden;background:#f3e3c6;display:grid;place-items:center}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph-icon{font-size:3rem}

.bar{height:8px;background:#efe0bd;border-radius:8px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#e6a935,var(--gold));border-radius:8px;transition:width .3s}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.9rem;flex-wrap:wrap}
.row:last-child{border-bottom:0}

.actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:.85rem}
.tag{padding:3px 10px;border-radius:6px;font-size:.72rem;font-weight:600;background:#f1b36a;color:var(--brown)}
.tag.admin{background:#7A2E16;color:var(--cream)}

.alert{padding:12px 16px;background:#fef3c7;border-left:4px solid var(--gold);border-radius:8px;margin-bottom:16px;font-size:.9rem}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--brown);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0}
.bottom a{flex:1;text-align:center;color:#d9b88f;font-size:.66rem;padding:4px 0}
.bottom a span{display:block;font-size:1.3rem}
.bottom a.on{color:var(--gold);font-weight:600}
@media(min-width:900px){.bottom{max-width:720px;margin:0 auto 12px;border-radius:22px}}
</style>
</head>
<body>

<div class="top">
  <b><a href="index.html">Sanathana Gurukulam</a></b>
  <span>
    <a href="index.html">Home</a>
    <a href="courses.html">Courses</a>
    <a href="live.html">Live</a>
    <a href="community.html">Community</a>
    <a href="admin.html" id="adminLink" hidden>Admin</a>
    <button class="btn gold sm" id="out">Logout</button>
  </span>
</div>

<div class="wrap">
  <div class="header-row">
    <div>
      <h1 id="hello">Namaste</h1>
      <p class="sub">Welcome to your Gurukulam learning dashboard</p>
    </div>
    <div>
      <span class="tag" id="userRole">Learner</span>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="sE">0</b>Courses enrolled</div>
    <div class="stat"><b id="sD">0</b>Completed</div>
    <div class="stat"><b id="sA">0%</b>Average progress</div>
    <div class="stat"><b id="sL">0</b>Upcoming live classes</div>
  </div>

  <div class="panel">
    <h2>My Enrolled Courses</h2>
    <div class="grid" id="mine"></div>
  </div>

  <div class="panel">
    <h2>Live Classes</h2>
    <div id="live"></div>
  </div>

  <div class="panel">
    <h2>Explore Courses</h2>
    <div class="grid" id="all"></div>
  </div>
</div>

<script type="module">
import { db, requireUser, logout, esc, ref, get, set, update, list, DEFAULT_COURSES } from "./firebase-init.js";

const $ = id => document.getElementById(id);
const when = t => new Date(t).toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" });

let me, courses = [], enr = {};
$("out").onclick = logout;

requireUser((u, p) => {
  me = u;
  $("hello").textContent = "Namaste, " + (p.name || u.displayName || "Learner");
  $("userRole").textContent = p.role === "admin" ? "Acharya (Admin)" : "Learner";
  if (p.role === "admin") $("userRole").classList.add("admin");
  $("adminLink").hidden = p.role !== "admin";
  load();
});

const getCourseIcon = id => {
  if (id.includes("gita")) return "📖";
  if (id.includes("sanskrit")) return "🪷";
  if (id.includes("history")) return "📜";
  if (id.includes("ramayan")) return "🏹";
  if (id.includes("yoga")) return "🧘";
  if (id.includes("vishnu")) return "🪔";
  if (id.includes("veda")) return "🕉️";
  if (id.includes("temple")) return "🛕";
  return "🕉️";
};

const card = (c, extra) => `
<div class="card">
  <div class="pic-holder">
    ${c.imageUrl ? `<img src="${esc(c.imageUrl)}" alt="${esc(c.title)}" onerror="this.onerror=null;this.parentElement.innerHTML='<span class=\\'ph-icon\\'>${getCourseIcon(c.id)}</span>'">` : `<span class="ph-icon">${getCourseIcon(c.id)}</span>`}
  </div>
  <a href="course.html?id=${esc(c.id)}"><b>${esc(c.title)}</b></a>
  <p class="muted" style="min-height:36px;font-size:.82rem">${esc(c.desc || "")}</p>
  <div>
    <span class="tag">${c.type === "free" ? "Free" : "Paid"}</span>
    <span class="muted">${c.lessons || 0} lessons</span>
  </div>
  ${extra}
</div>`;

async function load() {
  try {
    const [cs, en, ls] = await Promise.all([
      list("courses"),
      get(ref(db, "enrollments/" + me.uid)),
      list("liveClasses")
    ]);

    courses = cs && cs.length ? cs.filter(c => c.published !== false) : [...DEFAULT_COURSES];
    enr = en.val() || {};

    const mine = courses.filter(c => enr[c.id]);
    const rest = courses.filter(c => !enr[c.id]);
    const prog = c => (enr[c.id] && typeof enr[c.id].progress === "number") ? enr[c.id].progress : 0;

    // Render My Courses
    $("mine").innerHTML = mine.map(c => {
      const p = prog(c);
      const isComplete = p >= 100;
      return card(c, `
        <div class="bar"><i style="width:${p}%"></i></div>
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)">
          <span>Progress: <b>${p}%</b></span>
          ${isComplete ? '<span style="color:#166534;font-weight:600">Completed!</span>' : ''}
        </div>
        <div class="actions">
          ${isComplete 
            ? `<a class="btn sm gold" href="certificate.html?id=${esc(c.id)}">🏅 Certificate</a>` 
            : `<a class="btn sm" href="course.html?id=${esc(c.id)}">Continue</a>
               <button class="btn sm ghost" data-step="${esc(c.id)}">+ 1 Lesson</button>`
          }
        </div>
      `);
    }).join("") || '<p class="muted">You have not enrolled in any course yet. Pick one from Explore Courses below to get started!</p>';

    // Render Explore Courses
    $("all").innerHTML = rest.map(c => card(c, `
      <div style="margin-top:auto;padding-top:8px">
        <button class="btn sm gold" style="width:100%" data-enroll="${esc(c.id)}">Enroll Now</button>
      </div>
    `)).join("") || '<p class="muted">You have enrolled in all available courses!</p>';

    // Render Live Classes
    const now = Date.now();
    const live = (ls || []).sort((a, b) => (a.startsAt || 0) - (b.startsAt || 0));
    $("live").innerHTML = live.map(c => `
      <div class="row">
        <span>
          <b>${esc(c.title)}</b> ${c.startsAt <= now + 3600000 && c.startsAt >= now - 3600000 ? '<span class="tag" style="background:#ef4444;color:#fff">● LIVE</span>' : ''}
          <br><span class="muted">${esc(c.teacher || "Acharya")} · ${when(c.startsAt)}</span>
        </span>
        ${c.link ? `<a class="btn sm" href="${esc(c.link)}" target="_blank" rel="noopener">Join Class →</a>` : ''}
      </div>
    `).join("") || '<p class="muted">No upcoming live classes scheduled at the moment.</p>';

    // Update Stats
    $("sE").textContent = mine.length;
    $("sD").textContent = mine.filter(c => prog(c) >= 100).length;
    $("sA").textContent = (mine.length ? Math.round(mine.reduce((s, c) => s + prog(c), 0) / mine.length) : 0) + "%";
    $("sL").textContent = live.length;

  } catch (err) {
    console.error("Dashboard load error:", err);
  }
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button");
  if (!b) return;
  const enrollId = b.dataset.enroll;
  const stepId = b.dataset.step;

  if (enrollId) {
    b.disabled = true;
    b.textContent = "Enrolling...";
    const r = ref(db, `enrollments/${me.uid}/${enrollId}`);
    await set(r, { progress: 0, enrolledAt: Date.now(), done: {} });
    await load();
  } else if (stepId) {
    b.disabled = true;
    const c = courses.find(x => x.id === stepId) || DEFAULT_COURSES.find(x => x.id === stepId);
    const totalLessons = c?.lessons || 10;
    const doneObj = { ...(enr[stepId]?.done || {}) };
    
    // Find next uncompleted lesson
    let nextIdx = 1;
    while (nextIdx <= totalLessons && doneObj["L" + nextIdx]) {
      nextIdx++;
    }
    if (nextIdx <= totalLessons) {
      doneObj["L" + nextIdx] = true;
    }

    const completedCount = Object.keys(doneObj).filter(k => doneObj[k]).length;
    const newProgress = Math.min(100, Math.round(completedCount / totalLessons * 100));

    const r = ref(db, `enrollments/${me.uid}/${stepId}`);
    await update(r, {
      progress: newProgress,
      done: doneObj,
      ...(newProgress >= 100 ? { completedAt: Date.now() } : {})
    });
    await load();
  }
});
</script>
<nav class="bottom" aria-label="App">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="courses.html"><span>📖</span>Courses</a>
  <a href="live.html"><span>🎥</span>Live</a>
  <a href="community.html"><span>👥</span>Community</a>
  <a class="on" href="dashboard.html"><span>👤</span>Dashboard</a>
</nav>
</body>
</html>
