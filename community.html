<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community – Sanathana Gurukulam</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#F7E8C8;--sand:#E8C98F;--maroon:#7A2E16;--brown:#4A1F0E;--gold:#D99A27;--card:#FFF8EA;--muted:#7d5a45;--line:rgba(122,46,22,.15);--shadow:0 6px 18px rgba(74,31,14,.12)}
*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
body{font-family:'Poppins',sans-serif;color:var(--brown);background:radial-gradient(circle at 20% 0,#fff6e0,var(--cream) 60%);min-height:100vh}
h1,h2,h3{font-family:'Cormorant Garamond',serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer;border:0}
input,select{font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--brown);width:100%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--maroon);color:var(--cream);padding:10px 20px;border-radius:12px;font-weight:500}
.btn.gold{background:var(--gold);color:var(--brown)}.btn.ghost{background:none;border:1px solid var(--maroon);color:var(--maroon)}.btn.sm{padding:5px 12px;font-size:.8rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 22px;background:var(--brown);color:var(--cream)}
.top b{font-family:'Cormorant Garamond';font-size:1.5rem}.top span{display:flex;gap:14px;align-items:center;font-size:.88rem}
.wrap{max-width:1100px;margin:0 auto;padding:22px 18px 60px}.wrap>h1{font-size:2.3rem;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);font-size:.85rem;color:var(--muted)}
.stat b{display:block;font-family:'Cormorant Garamond';font-size:2.3rem;color:var(--maroon)}
.panel{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:22px}.panel h2{font-size:1.6rem;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;height:110px;object-fit:cover;border-radius:10px}
.bar{height:8px;background:#efe0bd;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.muted{color:var(--muted);font-size:.85rem}.tag{padding:2px 10px;border-radius:6px;font-size:.72rem;font-weight:600;background:#f1b36a}
.login{max-width:400px;margin:8vh auto;background:var(--card);border-radius:22px;padding:28px;box-shadow:var(--shadow);text-align:center}
.login h1{font-size:2.2rem}.login .stack{display:grid;gap:12px;margin-top:16px}.login hr{border:0;border-top:1px solid var(--line);margin:18px 0}
#msg{margin-top:14px;font-size:.85rem;color:var(--maroon)}

.top a:hover{color:var(--gold)}
.hero2{display:grid;gap:18px;grid-template-columns:1fr;margin-bottom:22px}@media(min-width:800px){.hero2{grid-template-columns:320px 1fr}}
.hero2 img{width:100%;max-height:260px;object-fit:cover;border-radius:18px;box-shadow:var(--shadow)}
.hero2 h1{font-size:2.4rem}
.lesson{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lesson input{width:20px;height:20px;accent-color:var(--maroon);padding:0}
.video{aspect-ratio:16/9;width:100%;border:0;border-radius:14px;margin-bottom:22px}
.badge{background:#d62a2a;color:#fff;padding:2px 10px;border-radius:20px;font-size:.72rem;font-weight:600}
.chatbox{display:grid;gap:16px;grid-template-columns:1fr}@media(min-width:800px){.chatbox{grid-template-columns:240px 1fr}}
.rooms{background:var(--brown);color:var(--cream);border-radius:18px;padding:14px;height:max-content}.rooms h3{color:var(--sand);margin-bottom:6px;font-size:1.3rem}
.room{display:block;width:100%;text-align:left;background:none;color:inherit;padding:10px 12px;border-radius:12px}
.room.on,.room:hover{background:rgba(232,201,143,.2)}
.msgs{height:380px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px;background:#fff;border-radius:14px}
.m{max-width:80%;padding:8px 12px;border-radius:14px 14px 14px 4px;background:#f6ecd4;font-size:.9rem;word-break:break-word}
.m small{display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--maroon);font-size:.72rem;margin-bottom:2px}
.m small .time{font-weight:normal;opacity:.7;font-size:.68rem}
.m.me{align-self:flex-end;background:var(--maroon);color:var(--cream);border-radius:14px 14px 4px 14px}
.m.me small{color:var(--sand)}
.m .x{background:none;color:inherit;opacity:.6;cursor:pointer;padding:0 4px;font-size:.85rem}
.m .x:hover{opacity:1;color:#dc2626}
.send{display:flex;gap:10px;margin-top:10px}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--brown);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));border-radius:22px 22px 0 0}
.bottom a{flex:1;text-align:center;color:#d9b88f;font-size:.66rem;padding:4px 0}
.bottom a span{display:block;font-size:1.3rem}
.bottom a.on{color:var(--gold);font-weight:600}
@media(min-width:900px){.bottom{max-width:720px;margin:0 auto 12px;border-radius:22px}}
</style></head><body>
<div class="top"><b><a href="index.html">Sanathana Gurukulam</a></b><span><a href="index.html">Home</a><a href="courses.html">Courses</a><a href="live.html">Live</a><a href="community.html" style="color:var(--gold)">Community</a><a href="dashboard.html">Dashboard</a><button class="btn gold sm" id="out">Logout</button></span></div>
<div class="wrap"><h1>Community Circles</h1>
<div class="chatbox">
  <aside class="rooms"><h3>Circles</h3><div id="rooms"></div></aside>
  <div><div class="panel" style="padding:12px"><h2 id="rt" style="margin:0 0 8px"></h2><div class="msgs" id="msgs" aria-live="polite"></div>
  <form class="send" id="f"><input id="t" maxlength="500" placeholder="Write a message in this circle…" aria-label="Message" autocomplete="off" required><button class="btn">Send</button></form></div></div>
</div></div>
<nav class="bottom" aria-label="App">
  <a href="index.html"><span>🏠</span>Home</a>
  <a href="courses.html"><span>📖</span>Courses</a>
  <a href="live.html"><span>🎥</span>Live</a>
  <a class="on" href="community.html"><span>👥</span>Community</a>
  <a href="dashboard.html"><span>👤</span>Dashboard</a>
</nav>
<script type="module">
import { db, requireUser, logout, esc, ref, push, remove, onValue, query, limitToLast } from "./firebase-init.js";
const $ = id => document.getElementById(id);
const ROOMS = { gita: "🪔 Gita Study Circle", sanskrit: "🪷 Sanskrit Learners", yoga: "🧘 Daily Yoga", temple: "🛕 Temple Heritage", parents: "👨‍👩‍👧 Parents of Bala" };
let me, prof, room = "gita", off;
$("out").onclick = logout;

requireUser((u, p) => { me = u; prof = p; $("rooms").innerHTML = Object.entries(ROOMS).map(([k, v]) => `<button class="room" data-r="${k}">${v}</button>`).join(""); open(room); });

function open(r) {
  room = r; off?.();
  $("rt").textContent = ROOMS[r];
  document.querySelectorAll(".room").forEach(b => b.classList.toggle("on", b.dataset.r === r));
  off = onValue(query(ref(db, "community/" + r), limitToLast(60)), snap => {
    const v = snap.val() || {};
    $("msgs").innerHTML = Object.entries(v).map(([k, m]) => {
      const timeStr = m.at ? new Date(m.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      const canDelete = prof.role === "admin" || m.uid === me.uid;
      return `<div class="m ${m.uid === me.uid ? "me" : ""}">
        <small>
          <span>${esc(m.name || "Learner")}</span>
          <span><span class="time">${timeStr}</span> ${canDelete ? `<button class="x" data-del="${k}" title="Delete message">✕</button>` : ""}</span>
        </small>
        ${esc(m.text)}
      </div>`;
    }).join("") || '<p class="muted">No messages yet. Start with a Namaste 🙏</p>';
    $("msgs").scrollTop = $("msgs").scrollHeight;
  }, () => ($("msgs").innerHTML = '<p class="muted">Could not load messages.</p>'));
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.r) open(b.dataset.r);
  else if (b.dataset.del && confirm("Delete this message?")) remove(ref(db, `community/${room}/${b.dataset.del}`));
});
$("f").onsubmit = async e => {
  e.preventDefault();
  const text = $("t").value.trim(); if (!text) return;
  $("t").value = "";
  await push(ref(db, "community/" + room), { uid: me.uid, name: prof.name || "Learner", text, at: Date.now() });
};
</script>
</body></html>
